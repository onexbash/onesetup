# Ensure Directory: XDG_CONFIG_HOME
- name: "Ensure Directory exists: {{ XDG_CONFIG_HOME }}"
  become: true
  ansible.builtin.file:
    path: "{{ XDG_CONFIG_HOME }}"
    state: directory
    mode: "0755"
    owner: "{{ ONESETUP_SYSTEM_USERNAME }}"
    group: "{{ ONESETUP_SYSTEM_USER_GROUP }}"

