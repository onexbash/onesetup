---
# -- VARIABLES FOR SHELL PRE-TASK -- #

# Global Environment Variables (Defaults)
global_env_vars:
  # XDG BASE DIRS
  - name: XDG_CONFIG_HOME
    value: "${XDG_CONFIG_HOME:-$HOME/.config}"
  - name: XDG_CACHE_HOME
    value: "${XDG_CACHE_HOME:-$HOME/.cache}"
  - name: XDG_DATA_HOME
    value: "${XDG_DATA_HOME:-$HOME/.local/share}"
  - name: XDG_STATE_HOME
    value: "${XDG_STATE_HOME:-$HOME/.local/state}"
  # ZDOTDIR
  - name: ZDOTDIR
    value: "${ZDOTDIR:-$HOME}"
  # SHELL DIRS
  - name: SHELL_CONFIG_DIR
    value: "${XDG_CONFIG_HOME:-$HOME/.config}/shell"
  - name: SHELL_SCRIPTS_DIR
    value: "${XDG_CONFIG_HOME:-$HOME/.config}/scripts"
  - name: SHELL_UTIL_FILE
    value: "${SHELL_CONFIG_DIR}/util.sh"
# Valid Login Shells (added to /etc/shells)
valid_shells:
  - /bin/bash
  - /bin/csh
  - /bin/dash
  - /bin/ksh
  - /bin/sh
  - /bin/tcsh
  - /bin/zsh
  - /opt/homebrew/bin/bash
  - /opt/homebrew/bin/zsh
  - /opt/homebrew/bin/pwsh
  - /opt/homebrew/opt/powershell/bin/pwsh
# Global Shell Files (where env-vars should be exported)
global_env_files:
  - path: /etc/zshenv
    validate: "zsh -n %s"
  - path: /etc/profile
    validate: "sh -n %s"
    # Insert before /etc/bashrc is sourced, so user configs already see the vars
    insertbefore: '^if \[ "\$\{BASH-no\}" != "no" \]'

# Global System Paths (Added to $PATH)
# Priority: Lower Number => Higher Priority | 0 - 99
system_paths:
  # custom (Highest Priority)
  - name: custom
    priority: 0 # → /etc/paths.d/00-custom
    entries: []
  # homebrew
  - name: homebrew
    priority: 10 # → /etc/paths.d/10-homebrew
    entries:
      - /opt/homebrew/bin
      - /opt/homebrew/sbin
  # gnu-coreutils
  - name: gnu
    priority: 20 # → /etc/paths.d/20-gnu (GNU tools override the BSD versions in /usr/bin)
    entries:
      - /opt/homebrew/opt/coreutils/libexec/gnubin
      - /opt/homebrew/opt/grep/libexec/gnubin
  # system
  - name: system
    priority: 30 # → /etc/paths.d/30-system
    entries:
      - /usr/local/bin
      - /System/Cryptexes/App/usr/bin
      - /usr/bin
      - /bin
      - /usr/sbin
      - /sbin
  # cryptex
  - name: cryptex
    priority: 40 # → /etc/paths.d/40-cryptex
    entries:
      - /var/run/com.apple.security.cryptexd/codex.system/bootstrap/usr/local/bin
      - /var/run/com.apple.security.cryptexd/codex.system/bootstrap/usr/bin
      - /var/run/com.apple.security.cryptexd/codex.system/bootstrap/usr/appleinternal/bin
  # pmk-global
  - name: pmk-global
    priority: 50 # → /etc/paths.d/50-pmk-global
    entries:
      - /pkg/env/global/bin
  # custom (Lowest Priority)
  - name: custom
    priority: 99 # → /etc/paths.d/99-custom
    entries: []
