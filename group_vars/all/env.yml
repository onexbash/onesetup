# -- Environment Variables -- #
# This File defines and validates all Environment Variables that the user can set in the config.yml.
# Default Values as well as reading from config.yml & exporting them is handled by the onesetup executable: ./bin/onesetup

# Arguments:
# - mandatory: If the playbook run should cancel when value is missing/invalid [default: false]
# - normalize: If the value should be normalized(lowercased & white-space trimmed) [default: true]

onesetup_env_vars:
  # -- Remote -- #
  - name: ONESETUP_REMOTE_PROVIDER
    mandatory: true
    validate: "^(github|gitlab|bitbucket)$"
  - name: ONESETUP_REMOTE_USERNAME
    mandatory: true
    normalize: false # case-sensitive
  - name: ONESETUP_REMOTE_CONNECTION
    mandatory: true
    validate: "^(ssh|https)$"
  - name: ONESETUP_REMOTE_PROJECT_REPO
    mandatory: true
    normalize: false # case-sensitive
  - name: ONESETUP_REMOTE_DOTFILES_REPO
    mandatory: true
    normalize: false # case-sensitive

  # -- System -- #
  - name: ONESETUP_SYSTEM_OS
    mandatory: true
    validate: "^(osx|linux|windows)$"
  - name: ONESETUP_SYSTEM_USERNAME
    mandatory: true
    normalize: false # case-sensitive
  - name: ONESETUP_SYSTEM_ROOT_USER
    mandatory: false
    normalize: false # case-sensitive
  - name: ONESETUP_SYSTEM_CONFIG_DIR
    mandatory: true
    normalize: false # case-sensitive (filesystem path)
    validate: '^(/|[A-Za-z]:\\).+'
  - name: ONESETUP_SYSTEM_TARGET_DIR
    mandatory: true
    normalize: false # case-sensitive (filesystem path)
    validate: '^(/|[A-Za-z]:\\).+'
  - name: ONESETUP_SYSTEM_STORAGE_DIR
    mandatory: true
    normalize: false # case-sensitive (filesystem path)
    validate: '^(/|[A-Za-z]:\\).+'
  - name: ONESETUP_SYSTEM_DOTFILES_DIR
    mandatory: true
    normalize: false # case-sensitive (filesystem path)
    validate: '^(/|[A-Za-z]:\\).+'
  - name: ONESETUP_SYSTEM_BIN_DIR
    mandatory: true
    normalize: false # case-sensitive (filesystem path)
    validate: '^(/|[A-Za-z]:\\).+'
  - name: ONESETUP_SYSTEM_TMP_DIR
    mandatory: false
    normalize: false # case-sensitive (filesystem path)
    validate: '^(/|[A-Za-z]:\\).+'
  - name: ONESETUP_SYSTEM_USER_GROUP
    mandatory: false
    normalize: false # case-sensitive
  - name: ONESETUP_SYSTEM_ADMIN_GROUP
    mandatory: false
    normalize: false # case-sensitive

  # -- Project -- #
  - name: ONESETUP_PROJECT_DEVELOPMENT
    mandatory: false
    validate: "^(true|false)$"
  - name: ONESETUP_PROJECT_DEBUG
    mandatory: false
    validate: "^(true|false)$"

    # -- Dynamic -- #
  - name: ONESETUP_PROJECT_REPO_URI
    mandatory: true
    normalize: false # case-sensitive url
    validate: "^https?://.+"
  - name: ONESETUP_DOTFILES_REPO_URI
    mandatory: true
    normalize: false # case-sensitive url
    validate: "^https?://.+"
  - name: ONESETUP_PROJECT_REPO_RAW
    mandatory: false
    normalize: false # case-sensitive url
    validate: "^https?://.+"
  - name: ONESETUP_DOTFILES_REPO_RAW
    mandatory: false
    normalize: false # case-sensitive url
    validate: "^https?://.+"
