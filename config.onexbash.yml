# -- ONESETUP CONFIG - onexbash -- #
---
modules:
  - shell
  - ssh
  - dotfiles
  - fonts
  - apps
  - settings
  - custom
shell:
  login: /opt/homebrew/bin/zsh
  env:
    EDITOR: nvim

dotfiles:
  repo: https://github.com/onexbash/dotfiles.git # cloned via SSH if ONESETUP_SSH_KEY is set
  # -- Dotfiles Mapping -- #
  mapping:
    # -- Shell Config Files -> ~/ -- #
    - { src: shell/home/.zshrc, dest: ~/.zshrc }
    - { src: shell/home/.bashrc, dest: ~/.bashrc }
    - { src: shell/home/.profile, dest: ~/.profile }
    # -- Config Directory -> ~/.config -- #
    - { src: git, dest: ~/.config/git }
    - { src: nvim, dest: ~/.config/nvim }

    # -- Sub-Dirs & Files inside the Config Dir -> ~/.config/[subdir]/<file> -- #
    # Claude
    - { src: claude/agents, dest: ~/.config/claude/agents }
    - { src: claude/CLAUDE.md, dest: ~/.config/claude/CLAUDE.md }
    - { src: claude/settings.json, dest: ~/.config/claude/settings.json }
    - { src: claude/themes, dest: ~/.config/claude/themes }
    # Azure
    - { src: azure/config, dest: ~/.config/azure/config }
    # -- Aliases -- #
    - { src: ~/.config/claude, dest: ~/.claude }

apps:
  install:
    # Package managers, run in this order (MacOS: brew, mas)
    managers:
      osx: [brew]
    brew:
      taps:
        - felixkratz/formulae # borders, sketchybar
        - gaurav-gosain/tap # tuios-plot
        - lzhgus/tap # capso
        - nikitabobko/tap # aerospace
        - supercmdlabs/supercmd # supercmd
        - teamookla/speedtest # speedtest
      formulas:
        # GNU versions of the BSD tools on MacOS
        - bc
        - coreutils
        - gawk
        - gnu-sed
        - gnu-tar
        - grep
        # Shell
        - atuin # Shell history
        - carapace # Completions
        - starship # Prompt
        - zoxide # Smarter cd
        - zsh
        - bash
        - mas # App Store CLI Interface
        - defaultbrowser
        - dockutil
        - openssh
        - curl
        - zsh-autocomplete
        - zsh-autosuggestions
        - zsh-fast-syntax-highlighting
        # Terminal multiplexers
        - herdr
        - tuios
        # CLI tools
        - ast-grep # Structural code search
        - bat # cat with syntax highlighting
        - catimg # Images in the terminal
        - cheat # Cheatsheets
        - clipboard # Clipboard manager
        - ekphos
        - exiftool
        - eza # ls replacement
        - fastfetch # System info
        - fd # find replacement
        - fzf # Fuzzy finder
        - glow # Markdown renderer
        - gum # Shell script UI components
        - jq # JSON processor
        - ouch # (De)compression
        - pastel # Colors
        - ripgrep # grep replacement
        - scc # Code counter
        - sk # Fuzzy finder (skim)
        - tlrc # Cheatsheets (tldr)
        - tree
        - utftex # LaTeX → Unicode
        - yq # YAML processor
        # Editors
        - luarocks # Lua packages (neovim plugins)
        - neovim
        - tree-sitter-cli
        - vim
        # Git
        - gh # GitHub CLI
        - git
        - git-crypt
        - git-delta # Diff pager
        - git-filter-repo
        - lazygit
        - worktrunk # Git worktrees
        # Development
        - kubernetes-cli
        - mise # Dev tool & runtime manager
        - ollama # Local LLMs
        - podman-compose # Containers (brings podman)
        - postgresql@18
        # Network
        - cloudflared # Cloudflare Tunnel
        - gping # ping with a graph
        - iproute2mac # IP command
        - netcat
        - teamookla/speedtest/speedtest
        - wget
        # Security & secrets
        - gnupg
        - infisical # Secrets manager CLI
        - pinentry-mac # GPG passphrase dialog
        - proton-pass-cli
        # Media & fonts
        - ffmpegthumbnailer # Video thumbnails (brings ffmpeg)
        - fontforge
        - imagemagick
        # MacOS utilities
        - cliclick # Mouse & keyboard from the command line
        - felixkratz/formulae/borders # JankyBorders: window borders
        - felixkratz/formulae/sketchybar # Status bar
      casks:
        # Window management & system utilities
        - appcleaner
        - cameracontroller
        - dockdoor # Window previews in the Dock
        - karabiner-elements # Keyboard remapping
        - lzhgus/tap/capso # Screenshots
        - nikitabobko/tap/aerospace # Tiling window manager
        - supercmdlabs/supercmd/supercmd # Launcher
        - thaw # Menu bar manager
        # Terminals
        - gaurav-gosain/tap/tuios-plot
        - ghostty
        - kitty
        - wezterm
        # Development
        - azure-cli
        - claude
        - claude-code@latest
        - drawio
        - git-credential-manager
        - insomnia # API client
        - intellij-idea-oss
        - sublime-text
        - utm # Virtual machines
        - vscodium
        - zed
        # Browsers
        - firefox@developer-edition
        - tor-browser
        # Passwords & Proton
        - keepassxc
        - proton-drive
        - proton-mail
        - proton-mail-bridge
        - proton-meet
        - proton-pass
        - protonvpn
        # Communication
        - discord
        - microsoft-teams
        - session
        - whatsapp
        # Productivity
        - deepl
        - obsidian
        - stirling-pdf
        # Design & media
        - canva
        - figma
        - gimp
        - mediahuman-youtube-downloader
        - obs
        - shotcut
        - spotify
        - youtube-to-mp3
  autostart:
    # Utilities
    - { name: AeroSpace, bundle_id: bobko.aerospace }
    - { name: Thaw, bundle_id: com.stonerl.Thaw }
    - { name: SuperCmd, bundle_id: com.supercmd.app }
    - { name: DockDoor, bundle_id: com.ethanbills.DockDoor }
    - { name: Capso, bundle_id: com.awesomemacapps.capso }
    # GUI Apps
    - { name: Ghostty, bundle_id: com.mitchellh.ghostty }
    - {
        name: Firefox Developer Edition,
        bundle_id: org.mozilla.firefoxdeveloperedition,
      }
    - { name: Spotify, bundle_id: com.spotify.client }
    - { name: KeePassXC, bundle_id: org.keepassxc.keepassxc }
    - { name: Proton Pass, bundle_id: me.proton.pass.electron }
    - { name: Proton Mail, bundle_id: ch.protonmail.desktop }
    - { name: Microsoft Teams, bundle_id: com.microsoft.teams2 }
