---
# --              -- #
# --   SYMLINKS   -- #
# --              -- #
# Inspect Sources in Dotfiles-Mapping
- name: "Dotfiles: Inspect link sources"
  ansible.builtin.stat:
    path: "{{ _src }}"
    get_checksum: false
  vars: &link_paths
    _src: >-
      {{ (((item.src | expanduser) is abs) | ternary(item.src | expanduser, (cfg.dir | expanduser) ~ '/' ~ item.src))
         | regex_replace('/+$', '') }}
    _dest: "{{ item.dest | expanduser | regex_replace('/+$', '') }}"
  become: "{{ item.become | default(false) }}"
  loop: "{{ cfg.mapping }}"
  loop_control:
    label: "{{ item.src }}"
  register: dotfiles_src_stat

# Inspect Destinations in Dotfiles-Mapping
- name: "Dotfiles: Inspect link destinations"
  ansible.builtin.stat:
    path: "{{ _dest }}"
    follow: false # inspect the link itself, also detects broken links
    get_checksum: false
  vars: *link_paths
  become: "{{ item.become | default(false) }}"
  loop: "{{ cfg.mapping }}"
  loop_control:
    label: "{{ item.dest }}"
  register: dotfiles_dest_stat

# Validate the Symlink before creating it
- name: "Dotfiles: Validate links"
  ansible.builtin.assert:
    that: _problems | length == 0
    fail_msg: "{{ _problems }}"
    quiet: true
  vars:
    _problems: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for s, d in dotfiles_src_stat.results | zip(dotfiles_dest_stat.results) -%}
        {%- if not s.stat.exists and s.item.src is not abs -%}
          {%- set ns.out = ns.out + ['source missing in repo: ' ~ s.item.src] -%}
        {%- elif s.stat.exists and d.stat.exists and not d.stat.islnk
                 and d.stat.inode == s.stat.inode and d.stat.dev == s.stat.dev -%}
          {%- set ns.out = ns.out + ['parent of ' ~ d.item.dest ~ ' links into the repo, remove that parent link first'] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.out }}

# Cleanup Destination (with Backup)
# Real files/directories at a destination move to <state dir>/backups/<timestamp>/<original absolute path>,
# e.g. ~/.zshrc → ~/.local/state/onesetup/backups/20261118-153000/Users/me/.zshrc
- name: "Dotfiles: Back up real files/directories at link destinations"
  vars:
    _to_back_up: "{{ dotfiles_dest_stat.results | selectattr('stat.exists') | rejectattr('stat.islnk') | list }}"
  when: _to_back_up | length > 0
  block:
    - name: "Dotfiles: Set backup directory"
      ansible.builtin.set_fact:
        dotfiles_backup_dir: "{{ ONESETUP_STATE_DIR }}/backups/{{ now(fmt='%Y%m%d-%H%M%S') }}"

    # Created as the user (also for become links), so the whole backup tree stays readable by the user
    - name: "Dotfiles: Ensure backup directories exist"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
        owner: "{{ user }}"
        group: "{{ user_group }}"
      loop: >-
        {{ [ONESETUP_STATE_DIR ~ '/backups', dotfiles_backup_dir]
           + (_to_back_up | map(attribute='stat.path') | map('dirname')
              | map('regex_replace', '^', dotfiles_backup_dir) | unique | list) }}

    - name: "Dotfiles: Move real files/directories to the backup directory"
      ansible.builtin.command:
        argv:
          - mv
          - "{{ item.stat.path }}"
          - "{{ dotfiles_backup_dir }}{{ item.stat.path }}"
      become: "{{ item.item.become | default(false) }}"
      loop: "{{ _to_back_up }}"
      loop_control:
        label: "{{ item.stat.path }}"
      register: dotfiles_backups
      changed_when: true

# Inspect Parent Directories (with the link's become, so root-only paths are seen correctly)
- name: "Dotfiles: Inspect link parent directories"
  ansible.builtin.stat:
    path: "{{ _dest | dirname }}"
    get_checksum: false
  vars: *link_paths
  become: "{{ item.become | default(false) }}"
  loop: "{{ cfg.mapping }}"
  loop_control:
    label: "{{ _dest | dirname }}"
  register: dotfiles_parent_stat

# Create Parent Directory if missing (existing ones, e.g. $HOME or /etc, keep their permissions)
# System paths (become: true) get 0755 root, so other users & services can still read them
- name: "Dotfiles: Ensure parent directories exist"
  ansible.builtin.file:
    path: "{{ _parent }}"
    state: directory
    mode: "{{ '0755' if item.item.become | default(false) else '0700' }}"
    owner: "{{ root_user if item.item.become | default(false) else user }}"
    group: "{{ root_group if item.item.become | default(false) else user_group }}"
  vars:
    _parent: "{{ item.item.dest | expanduser | regex_replace('/+$', '') | dirname }}"
  become: "{{ item.item.become | default(false) }}"
  loop: "{{ dotfiles_parent_stat.results | rejectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ _parent }}"

# Symlink Dotfiles
- name: "Dotfiles: Symlink"
  ansible.builtin.file:
    src: "{{ _src }}"
    dest: "{{ _dest }}"
    state: link
    force: true # replace links that point elsewhere
  vars: *link_paths
  become: "{{ item.become | default(false) }}"
  loop: "{{ cfg.mapping }}"
  loop_control:
    label: "{{ item.dest }}"
  register: dotfiles_link
  ignore_errors: true

# Show a Report of Destination Backups
- name: "Report: Backed up files/directories"
  ansible.builtin.debug:
    msg: "{{ dotfiles_backups.results | map(attribute='cmd') | map('last') | list }}"
  when: dotfiles_backups.results | default([]) | length > 0

# Show a Report of Failed Symlink Creations
- name: "Report: Failed Symlinks"
  ansible.builtin.debug:
    msg: "Could not symlink: {{ failed_links | join(', ') }}"
  vars:
    failed_links: >-
      {{ dotfiles_link.results
         | selectattr('failed', 'defined')
         | selectattr('failed')
         | map(attribute='item.dest')
         | list }}
  when: failed_links | length > 0
