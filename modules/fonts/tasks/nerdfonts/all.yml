---
- name: "Install Nerd Fonts"
  vars:
    nerdfonts_base_url: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ cfg.nerdfonts.version }}"
    nerdfonts_dest_dir: "{{ (home ~ '/Library/Fonts') if os == 'osx' else (xdg_data_home ~ '/fonts') }}"
    nerdfonts: "{{ cfg.nerdfonts.fonts | rejectattr('name', 'in', cfg.nerdfonts.exclude) | list }}"
  block:
    # Ensure Directory exists with correct permissions
    - name: "Ensure destination directory exists"
      ansible.builtin.file:
        path: "{{ nerdfonts_dest_dir }}"
        state: directory
        mode: "0755"

    # Check if already installed (one file per style, any extension)
    - name: "Check installed files"
      ansible.builtin.find:
        paths: "{{ nerdfonts_dest_dir }}"
        patterns: "{{ item.styles | map('regex_replace', '^(.*)$', item.prefix ~ '-\\1.*') | list }}"
      loop: "{{ nerdfonts }}"
      loop_control:
        label: "{{ item.name }}"
      register: nerdfonts_check

    # Download & install missing Fonts (all variants, ttf + otf)
    - name: "Download & install missing fonts"
      ansible.builtin.unarchive:
        src: "{{ nerdfonts_base_url }}/{{ item.item.name }}.zip"
        dest: "{{ nerdfonts_dest_dir }}"
        remote_src: true
        mode: "0644"
        include: "{{ item.item.styles | map('regex_replace', '^(.*)$', '*-\\1.*') | list }}"
      loop: "{{ nerdfonts_check.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.matched < (item.item.styles | length)
      register: nerdfonts_installed

    # Rebuild Font Cache
    - name: "Rebuild font cache (linux)"
      ansible.builtin.command: fc-cache -f "{{ nerdfonts_dest_dir }}"
      when: os == 'linux' and nerdfonts_installed is changed
