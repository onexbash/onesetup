# -- ONESETUP CONFIG -- #
# Your personal setup. 'onesetup-init' copied this file to $ONESETUP_CONFIG
# (default: ~/.config/onesetup/onesetup.yml). Run 'onesetup' after changing it.
#
# How it works:
#   - 'modules' decides what runs. A module runs all its parts, 'module.part' runs only that part.
#   - Every module brings sensible defaults (modules/<module>/defaults/main.yml in the onesetup repo).
#     What you write here is merged into them:
#       lists are extended   → formulas: [k9s] installs k9s on top of the default formulas
#       values are replaced  → login: /opt/homebrew/bin/zsh
#       exclude: [...]       → removes default entries (where available)
#   - Secrets: 'onesetup-vault encrypt --file <file> --target config' writes them here, encrypted.
#   - Device-specific settings (hostname, SSH key for cloning, ...) are ONESETUP_* environment variables.
#   - Paths may start with ~/
---
modules:
  - shell # shell.env, shell.paths, shell.login, shell.gui_env
  - fonts # fonts.nerdfonts
  - apps # apps.install, apps.configure, apps.autostart
  - settings # settings.defaults, settings.system, settings.dock, settings.finder, settings.keymaps, settings.wallpaper, settings.browser
  # - dotfiles # dotfiles.clone, dotfiles.link (needs dotfiles.repo)
  # - ssh # ssh.identities, ssh.config, ssh.known_hosts (overwrites ~/.ssh/known_hosts), ssh.authorized_keys
  # - custom # custom.tasks (your own Ansible task files)

