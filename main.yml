---
# -- -- -- -- -- -- -- -- #
# --   MAIN PLAYBOOK   -- #
- name: onesetup
  hosts: localhost
  
  # -- VARIABLES -- #
  vars:
    # Environment Variables: User Environment
    USER: "{{ ansible_facts['env']['USER'] }}"
    HOME: "{{ ansible_facts['env']['HOME'] }}"
    XDG_CONFIG_HOME: "{{ ansible_facts['env']['XDG_CONFIG_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.config') }}"
    XDG_CACHE_HOME: "{{ ansible_facts['env']['XDG_CACHE_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.cache') }}"
    XDG_DATA_HOME: "{{ ansible_facts['env']['XDG_DATA_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.local/share') }}"
    XDG_STATE_HOME: "{{ ansible_facts['env']['XDG_STATE_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.local/state') }}"
    ZDOTDIR: "{{ ansible_facts['env']['ZDOTDIR'] }}"
    CARGO_HOME: "{{ ansible_facts['env']['CARGO_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.cargo') }}"
    RUSTUP_HOME: "{{ ansible_facts['env']['RUSTUP_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.rustup') }}"
  # Variable Prompts
  vars_prompt:
    - name: SUDO_PASSWORD
      prompt: "Sudo password"
      private: true

  # -- PRE-TASKS -- #
  pre_tasks:
    # Pre-Task: Set Become Password as Ansible Fact
    - name: "Set become password gathered in user-prompt as Ansible Fact"
      set_fact:
        ansible_become_password: "{{ SUDO_PASSWORD }}"
        cacheable: false
      no_log: true

    # Include Pre-Tasks
    - include_tasks: pre_tasks/all/env.yml # Environment-Variable Discovery & Validation (+ Normalization)
    - include_tasks: pre_tasks/all/shell.yml # Set Default Shell & Gather Shell Paths
    
    # Pre-Task: Include OS-Specific Variables
    - name: "group_vars | Include OS-specific variables ({{ ONESETUP_SYSTEM_OS }})"
      ansible.builtin.include_vars:
        dir: "{{ playbook_dir }}/group_vars/{{ ONESETUP_SYSTEM_OS }}" # The variables in group_vars/all/ are already auto-loaded by ansible
        extensions:
          - yml
      ignore_errors: true  # Skip if OS-specific folder doesn't exist
  
    # Pre-Task: Include MacOS Pre-Tasks
    - name: "Include Pre-Tasks (macos)"
      ansible.builtin.include_tasks: "pre_tasks/osx/{{ item }}.yml"
      loop:
        - dependencies
        - filesystem
        - xcode
      loop_control:
        label: "{{ item }}"
      when: ONESETUP_SYSTEM_OS == 'osx'
    
    # Pre-Task: Include Linux Pre-Tasks
    - name: "Include Pre-Tasks (linux)"
      ansible.builtin.include_tasks: "pre_tasks/linux/{{ item }}.yml"
      loop:
        - distro
      loop_control:
        label: "{{ item }}"
      when: ONESETUP_SYSTEM_OS == 'linux'
    
    # Pre-Task: Include Windows Pre-Tasks
    - name: "Include Pre-Tasks (windows)"
      ansible.builtin.include_tasks: "pre_tasks/windows/{{ item }}.yml"
      loop:
        - main
      loop_control:
        label: "{{ item }}"
      when: ONESETUP_SYSTEM_OS == 'windows'
  # -- ROLES -- #
  roles:
    - { role: dotfiles, tags: ["dotfiles"] }
    - { role: fonts, tags: ["fonts"] }
    - { role: apps, tags: ["apps"] }
    - { role: settings, tags: ["settings"] }
