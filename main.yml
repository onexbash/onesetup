---
# -- -- -- -- -- -- -- -- #
# --   MAIN PLAYBOOK   -- #
- name: onesetup
  tags: [always]
  hosts: localhost

  # -- VARIABLES -- #
  vars:
    # Environment Variables: User Environment
    USER: "{{ ansible_facts['env']['USER'] }}"
    HOME: "{{ ansible_facts['env']['HOME'] }}"
    XDG_CONFIG_HOME: "{{ ansible_facts['env']['XDG_CONFIG_HOME'] | default(HOME ~ '/.config', true) }}"
    XDG_CACHE_HOME: "{{ ansible_facts['env']['XDG_CACHE_HOME'] | default(HOME ~ '/.cache', true) }}"
    XDG_DATA_HOME: "{{ ansible_facts['env']['XDG_DATA_HOME'] | default(HOME ~ '/.local/share', true) }}"
    XDG_STATE_HOME: "{{ ansible_facts['env']['XDG_STATE_HOME'] | default(HOME ~ '/.local/state', true) }}"
    ZDOTDIR: "{{ ansible_facts['env']['ZDOTDIR'] | default(HOME, true) }}"
    CARGO_HOME: "{{ ansible_facts['env']['CARGO_HOME'] | default(HOME ~ '/.cargo', true) }}"
    RUSTUP_HOME: "{{ ansible_facts['env']['RUSTUP_HOME'] | default(HOME ~ '/.rustup', true) }}"

  # Variable Prompts
  vars_prompt:
    - name: SUDO_PASSWORD
      prompt: "Sudo password"
      private: true

  # -- PRE-TASKS -- #
  pre_tasks:
    # Pre-Task: Set Become Password as Ansible Fact
    - name: "Set become password gathered in user-prompt as Ansible Fact"
      set_fact:
        ansible_become_password: "{{ SUDO_PASSWORD }}"
        cacheable: false
      no_log: true
      tags: [always]

    # Include: OS-Independent Pre-Tasks
    - name: "Include OS-Independent Pre-Tasks"
      tags: [always]
      ansible.builtin.include_tasks:
        file: "pre_tasks/all/{{ pretask }}.yml"
        apply:
          tags: [always]
      vars:
        prefix: "PRE-TASK: {{ pretask }} |"
      loop:
        - env
        - system
        - shell
      loop_control:
        loop_var: pretask
        label: "{{ pretask }}"

    # Pre-Task: Add host to OS group (auto-loads group_vars/<OS>/)
    - name: "Add host to OS group ({{ ONESETUP_SYSTEM_OS }})"
      ansible.builtin.group_by:
        key: "{{ ONESETUP_SYSTEM_OS }}"
      tags: [always]

    # Include: MacOS Pre-Tasks
    - name: "Include Pre-Tasks (MacOS)"
      tags: [always]
      ansible.builtin.include_tasks:
        file: "pre_tasks/osx/{{ pretask }}.yml"
        apply:
          tags: [always]
      vars:
        prefix: "PRE-TASK: {{ pretask }} |"
      loop:
        - filesystem
        - shell
        - dependencies
        - clt
      loop_control:
        loop_var: pretask
        label: "{{ pretask }}"
      when: ONESETUP_SYSTEM_OS == 'osx'

    # Include: Linux Pre-Tasks
    - name: "Include Pre-Tasks (linux)"
      tags: [always]
      ansible.builtin.include_tasks:
        file: "pre_tasks/linux/{{ pretask }}.yml"
        apply:
          tags: [always]
      vars:
        prefix: "PRE-TASK: {{ pretask }} |"
      loop:
        - distro
      loop_control:
        loop_var: pretask
        label: "{{ pretask }}"
      when: ONESETUP_SYSTEM_OS == 'linux'

    # Include: Windows Pre-Tasks
    - name: "Include Pre-Tasks (windows)"
      tags: [always]
      ansible.builtin.include_tasks:
        file: "pre_tasks/windows/{{ pretask }}.yml"
        apply:
          tags: [always]
      vars:
        prefix: "PRE-TASK: {{ pretask }} |"
      loop:
        - main
      loop_control:
        loop_var: pretask
        label: "{{ pretask }}"
      when: ONESETUP_SYSTEM_OS == 'windows'

  # -- ROLES -- #
  roles:
    - { role: dotfiles, tags: ["dotfiles"] }
    - { role: fonts, tags: ["fonts"] }
    - { role: apps, tags: ["apps"] }
    - { role: settings, tags: ["settings"] }
    - { role: autostart, tags: ["autostart"] }
    - { role: firefox, tags: ["firefox"] }
