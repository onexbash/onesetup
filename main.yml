---
# -- -- -- -- -- -- -- -- #
# --   MAIN PLAYBOOK   -- #
# Runs the core (always) and then every module selected in the config file ($ONESETUP_CONFIG).
- name: Onesetup
  hosts: localhost

  # -- VARIABLES (module registry & system facts) -- #
  vars_files:
    - core/vars.yml

  # Variable Prompts
  vars_prompt:
    - name: SUDO_PASSWORD
      prompt: "Sudo password"
      private: true

  # -- CORE (always runs) -- #
  pre_tasks:
    - name: "Set become password gathered in user-prompt as Ansible Fact"
      ansible.builtin.set_fact:
        ansible_become_password: "{{ SUDO_PASSWORD }}"
        cacheable: false
      no_log: true

    - name: "Fail on unsupported operating systems"
      ansible.builtin.assert:
        that: os == 'osx'
        fail_msg: "onesetup currently supports macOS only (detected: {{ ansible_facts['system'] }})."
        quiet: true

    - name: "Read environment variables & system facts"
      ansible.builtin.include_tasks: core/env.yml

    - name: "Load config file & select modules"
      ansible.builtin.include_tasks: core/config.yml

    - name: "Set hostname"
      ansible.builtin.include_tasks: core/hostname.yml
      when: ONESETUP_HOSTNAME | length > 0

    - name: "Prepare {{ os }}"
      ansible.builtin.include_tasks: "core/{{ os }}/{{ core_task }}.yml"
      loop: [filesystem, dependencies, clt]
      loop_control:
        loop_var: core_task
      vars:
        clt_path: /Library/Developer/CommandLineTools
        clt_marker: /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
        softwareupdate_timeout: 1800 # How long to wait for 'softwareupdate' before timing out. 0 => never timeout

  # -- MODULES -- #
  tasks:
    - name: "Run modules"
      ansible.builtin.include_role:
        name: "{{ onesetup_module }}"
      loop: "{{ onesetup_plan | list }}"
      loop_control:
        loop_var: onesetup_module
