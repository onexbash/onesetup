---
# -- -- -- -- -- -- -- -- #
# --   MAIN PLAYBOOK   -- #
- name: onesetup
  hosts: localhost
  
  # -- VARIABLES -- #
  vars:
    # Environment Variables: Config_Key [remote]
    ONESETUP_REMOTE_PROVIDER: "{{ lookup('env', 'ONESETUP_REMOTE_PROVIDER', default='') }}"
    ONESETUP_REMOTE_USERNAME: "{{ lookup('env', 'ONESETUP_REMOTE_USERNAME', default='') }}"
    ONESETUP_REMOTE_CONNECTION: "{{ lookup('env', 'ONESETUP_REMOTE_CONNECTION', default='') }}"
    ONESETUP_REMOTE_PROJECT_REPO: "{{ lookup('env', 'ONESETUP_REMOTE_PROJECT_REPO', default='') }}"
    ONESETUP_REMOTE_DOTFILES_REPO: "{{ lookup('env', 'ONESETUP_REMOTE_DOTFILES_REPO', default='') }}"
    # Environment Variables: Config_Key [system] 
    ONESETUP_SYSTEM_OS: "{{ lookup('env', 'ONESETUP_SYSTEM_OS', default='') }}"
    ONESETUP_SYSTEM_USERNAME: "{{ lookup('env', 'ONESETUP_SYSTEM_USERNAME', default='') }}"
    ONESETUP_SYSTEM_ROOT_USER: "{{ lookup('env', 'ONESETUP_SYSTEM_ROOT_USER', default='') }}"
    ONESETUP_SYSTEM_CONFIG_DIR: "{{ lookup('env', 'ONESETUP_SYSTEM_CONFIG_DIR', default='') }}"
    ONESETUP_SYSTEM_INSTALL_DIR: "{{ lookup('env', 'ONESETUP_SYSTEM_INSTALL_DIR', default='') }}"
    ONESETUP_SYSTEM_STORAGE_DIR: "{{ lookup('env', 'ONESETUP_SYSTEM_STORAGE_DIR', default='') }}"
    ONESETUP_SYSTEM_DOTFILES_DIR: "{{ lookup('env', 'ONESETUP_SYSTEM_DOTFILES_DIR', default='') }}"
    ONESETUP_SYSTEM_BIN_DIR: "{{ lookup('env', 'ONESETUP_SYSTEM_BIN_DIR', default='') }}"
    ONESETUP_SYSTEM_TMP_DIR: "{{ lookup('env', 'ONESETUP_SYSTEM_TMP_DIR', default='') }}"
    ONESETUP_SYSTEM_USER_GROUP: "{{ lookup('env', 'ONESETUP_SYSTEM_USER_GROUP', default='') }}"
    ONESETUP_SYSTEM_ADMIN_GROUP: "{{ lookup('env', 'ONESETUP_SYSTEM_ADMIN_GROUP', default='') }}"
    # Environment Variables: Config_Key [project] 
    ONESETUP_PROJECT_DEVELOPMENT: "{{ lookup('env', 'ONESETUP_PROJECT_DEVELOPMENT', default='') }}"
    ONESETUP_PROJECT_DEBUG: "{{ lookup('env', 'ONESETUP_PROJECT_DEBUG', default='') }}"
    ONESETUP_PROJECT_REPO_URI: "{{ lookup('env', 'ONESETUP_PROJECT_REPO_URI', default='') }}"
    ONESETUP_DOTFILES_REPO_URI: "{{ lookup('env', 'ONESETUP_DOTFILES_REPO_URI', default='') }}"
    ONESETUP_PROJECT_REPO_RAW: "{{ lookup('env', 'ONESETUP_PROJECT_REPO_RAW', default='') }}"
    ONESETUP_DOTFILES_REPO_RAW: "{{ lookup('env', 'ONESETUP_DOTFILES_REPO_RAW', default='') }}"
    ONESETUP_DIR_DEV: "{{ lookup('env', 'ONESETUP_DIR_DEV', default='') }}"
    # Environment Variables: User Environment
    USER: "{{ ansible_facts['env']['USER'] }}"
    HOME: "{{ ansible_facts['env']['HOME'] }}"
    XDG_CONFIG_HOME: "{{ ansible_facts['env']['XDG_CONFIG_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.config') }}"
    XDG_CACHE_HOME: "{{ ansible_facts['env']['XDG_CACHE_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.cache') }}"
    XDG_DATA_HOME: "{{ ansible_facts['env']['XDG_DATA_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.local/share') }}"
    XDG_STATE_HOME: "{{ ansible_facts['env']['XDG_STATE_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.local/state') }}"
    ZDOTDIR: "{{ ansible_facts['env']['ZDOTDIR'] }}"
    CARGO_HOME: "{{ ansible_facts['env']['CARGO_HOME'] }}"
  # Variable Prompts
  vars_prompt:
    - name: SUDO_PASSWORD
      prompt: "Sudo password"
      private: true

  # -- PRE-TASKS -- #
  pre_tasks:
    # Include Pre-Task for Environment-Variable Discovery & Validation (+ Normalization)
    - include_tasks: pre_tasks/all/env_validation.yml
    
    # Pre-Task: Include OS-Specific Variables
    - name: "group_vars | Include OS-specific variables ({{ ONESETUP_SYSTEM_OS }})"
      ansible.builtin.include_vars:
        dir: "{{ playbook_dir }}/group_vars/{{ ONESETUP_SYSTEM_OS }}" # The variables in group_vars/all/ are already auto-loaded by ansible
        extensions:
          - yml
      ignore_errors: true  # Skip if OS-specific folder doesn't exist

    # Pre-Task: Set Become Password as Ansible Fact
    - name: "auth | set become password gathered in user-prompt"
      set_fact:
        ansible_become_password: "{{ SUDO_PASSWORD }}"
        cacheable: false
      no_log: true
    
    # Include OS-specific pre_tasks
    - include_tasks: pre_tasks/osx/dependencies.yml
      when: ONESETUP_SYSTEM_OS == 'osx'
    - include_tasks: pre_tasks/osx/filesystem.yml
      when: ONESETUP_SYSTEM_OS == 'osx'
    - include_tasks: pre_tasks/osx/xcode.yml
      when: ONESETUP_SYSTEM_OS == 'osx'
  
  # -- ROLES -- #
  roles:
    - { role: dotfiles, tags: ["dotfiles"] }
    - { role: apps, tags: ["apps"] }
    - { role: settings, tags: ["settings"] }
