---
# -- -- -- -- -- -- -- -- #
# --   MAIN PLAYBOOK   -- #
- name: "onesetup"
  # -- CONNECTION -- #
  hosts: localhost
  connection: local
  # -- VARIABLES -- #
  vars:
    ONESETUP_DIR: "{{ lookup('ansible.builtin.env', 'ONESETUP_DIR') }}"
    ONESETUP_REPO: "{{ lookup('ansible.builtin.env', 'ONESETUP_REPO') }}"
    DOTFILES_DIR: "{{ lookup('ansible.builtin.env', 'DOTFILES_DIR') }}"
    DOTFILES_REPO: "{{ lookup('ansible.builtin.env', 'DOTFILES_REPO') }}"
    DOTFILES_REPO_HTTPS: "https://github.com/{{ DOTFILES_REPO }}.git"
    DOTFILES_REPO_SSH: "git@github.com:{{ DOTFILES_REPO }}.git"
    USER: "{{ lookup('ansible.builtin.env', 'USER') }}"
    HOME: "{{ lookup('ansible.builtin.env', 'HOME') }}"
    XDG_CONFIG_HOME: "{{ lookup('ansible.builtin.env', 'XDG_CONFIG_HOME', default=HOME + '/.config/') }}"
    ZDOTDIR: "{{ lookup('ansible.builtin.env', 'ZDOTDIR') }}"
    CARGO_HOME: "{{ lookup('ansible.builtin.env', 'CARGO_HOME', default=HOME + '/.config/cargo') }}"
  vars_files:
    - group_vars/all/ssh.yml
  vars_prompt:
    - name: SUDO_PASSWORD
      prompt: "Enter your sudo password"
      private: true
  pre_tasks:
    - name: "auth | set become password gathered in user-prompt"
      set_fact:
        ansible_become_password: "{{ SUDO_PASSWORD }}"
        cacheable: false
      no_log: true
    # -- INCLUDE PRE_TASKS -- #
    # Include pre_task for System Discovery
    - name: "pre_tasks | System Discovery"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/pre_tasks/system_discovery.yml"
    # Include OS-Independent pre_tasks (for every OS)
    - name: "pre_tasks | OS-Independent (all)"
      ansible.builtin.include_tasks: "{{ item_pretask }}"
      with_fileglob:
        - "{{ playbook_dir }}/pre_tasks/all/*.yml"
      loop_control:
        loop_var: item_pretask
    # Include OS-Specific pre_tasks
    - name: "pre_tasks | OS-Specific ({{ onesetup_os }})"
      ansible.builtin.include_tasks: "{{ item_pretask }}"
      with_fileglob:
        - "{{ playbook_dir }}/pre_tasks/{{ onesetup_os }}/*.yml"
      loop_control:
        loop_var: item_pretask
    # -- INCLUDE GROUP_VARS -- #
    - name: "group_vars | OS-Independent (all)"
      include_vars:
        dir: "group_vars/all"
        extensions:
          - yml
    - name: "group_vars | OS-Specific ({{ onesetup_os }})"
      include_vars:
        dir: "group_vars/{{ onesetup_os }}"
        extensions:
          - yml
  # -- INCLUDE ROLES -- #
  roles:
    - { role: dotfiles, tags: ["dotfiles"] }
    - { role: apps, tags: ["apps"] }
    - { role: settings, tags: ["settings"] }
