---
# -- CORE: Environment Variables & System Facts -- #
# Device-specific settings come from ONESETUP_* environment variables only.
# Their defaults are exported by bin/onesetup-util (apply_config); this file validates them.
# - mandatory: cancel the run when the value is missing/invalid [default: false]
- name: "Read & validate environment variables"
  vars:
    onesetup_env_vars:
      - { name: ONESETUP_CONFIG, mandatory: true, validate: "^/.+" }
      - { name: ONESETUP_PROFILE, validate: "^[A-Za-z0-9_-]+$" }
      - { name: ONESETUP_HOSTNAME, validate: "^[A-Za-z0-9-]+$" }
      - { name: ONESETUP_INSTALL_DIR, mandatory: true, validate: "^/.+" }
      - { name: ONESETUP_STATE_DIR, mandatory: true, validate: "^/.+" }
      - { name: ONESETUP_BIN_DIR, mandatory: true, validate: "^/.+" }
      - { name: ONESETUP_SSH_KEY, validate: "^/.+" }
      - { name: ONESETUP_DEV_DIR, validate: "^/.+" }
      - { name: X_TARGET_DIR, mandatory: true, validate: "^/.+" }
  block:
    - name: "Read every environment variable"
      ansible.builtin.set_fact:
        onesetup_env_values: >-
          {{ onesetup_env_values | default({})
             | combine({item.name: lookup('ansible.builtin.env', item.name, default='') | trim}) }}
      loop: "{{ onesetup_env_vars }}"
      loop_control:
        label: "{{ item.name }}"

    # Empty optional values are fine; set values must match their pattern
    - name: "Fail on missing or invalid environment variables"
      ansible.builtin.assert:
        that: _invalid | length == 0
        fail_msg: >-
          Missing/invalid environment variable(s): {{ _invalid | join(', ') }}.
          Run playbooks through the 'onesetup' command, it exports the defaults.
        quiet: true
      vars:
        _invalid: >-
          {%- set ns = namespace(out=[]) -%}
          {%- for v in onesetup_env_vars -%}
            {%- set val = onesetup_env_values[v.name] -%}
            {%- if (val == '' and v.mandatory | default(false))
                   or (val != '' and v.validate is defined and val is not match(v.validate)) -%}
              {%- set ns.out = ns.out + [v.name ~ '=' ~ (val or '<unset>')] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.out }}

    - name: "Set every environment variable as an Ansible fact"
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ onesetup_env_values | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

# Group names are not part of the gathered facts
- name: "Read user & root group names"
  ansible.builtin.command: id -gn {{ item }}
  loop: ["{{ user }}", root]
  register: _groups
  changed_when: false
  check_mode: false

- name: "Set user & root facts"
  ansible.builtin.set_fact:
    user_group: "{{ _groups.results[0].stdout }}"
    root_user: root
    root_group: "{{ _groups.results[1].stdout }}"
