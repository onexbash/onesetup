---
# -- CORE: Ensure base directories exist with the right owner (follow: keeps symlinked dirs) -- #
- name: "Ensure user directories exist"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
    owner: "{{ user }}"
    group: "{{ user_group }}"
    follow: true
  loop:
    - "{{ xdg_config_home }}"
    - "{{ xdg_data_home }}"
    - "{{ xdg_state_home }}"
    - "{{ xdg_cache_home }}"
    - "{{ ONESETUP_CONFIG | dirname }}"
    - "{{ X_TARGET_DIR }}"
    - "{{ ONESETUP_STATE_DIR }}"
    - "{{ home }}/Library"

# The config file can hold vault-encrypted secrets
- name: "Ensure config file permissions: {{ ONESETUP_CONFIG }}"
  become: true
  ansible.builtin.file:
    path: "{{ ONESETUP_CONFIG }}"
    state: file
    mode: "0600"
    owner: "{{ user }}"
    group: "{{ user_group }}"
    follow: true

# Exception: 0755 so every user can run the onesetup commands in it
- name: "Ensure bin directory exists: {{ ONESETUP_BIN_DIR }}"
  become: true
  ansible.builtin.file:
    path: "{{ ONESETUP_BIN_DIR }}"
    state: directory
    mode: "0755"
    owner: "{{ root_user }}"
    group: "{{ root_group }}"
    follow: true
