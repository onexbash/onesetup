---
# -- CORE: Set the hostname to $ONESETUP_HOSTNAME (only runs when it is set) -- #
- name: "Read current hostnames"
  ansible.builtin.command: "scutil --get {{ item }}"
  loop: [HostName, LocalHostName, ComputerName]
  register: _hostnames
  changed_when: false
  failed_when: false # HostName is unset on a fresh macOS install
  check_mode: false

- name: "Set hostname to: {{ ONESETUP_HOSTNAME }}"
  become: true
  ansible.builtin.command: "scutil --set {{ item.item }} {{ ONESETUP_HOSTNAME }}"
  loop: "{{ _hostnames.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stdout != ONESETUP_HOSTNAME
