---
# Ensure ~/.ssh directory exists with correct permission
- name: "Ensure SSH Directory exists ({{ HOME }}/.ssh)"
  become: true
  ansible.builtin.file:
    path: "{{ HOME }}/.ssh"
    state: "directory"
    mode: "0700"
    owner: "{{ ONESETUP_SYSTEM_USERNAME }}"
    group: "{{ ONESETUP_SYSTEM_USER_GROUP }}"

# Rollout SSH Config Files from 'group_vars/all/ssh.yml'
- name: "Rollout SSH config files"
  ansible.builtin.copy:
    content: "{{ item.value }}\n"
    dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/{{ item.key }}"
    mode: "0600"
  loop: "{{ ssh_files | dict2items }}"
  no_log: true # Prevents secret leaking

# Rollout SSH Keys from 'group_vars/all/ssh.yml'
- name: "Rollout SSH Keys"
  ansible.builtin.copy:
    content: "{{ item.value }}\n"
    dest: "{{ HOME }}/.ssh/{{ item.key | regex_replace('_pub$', '.pub') }}"
    mode: "{{ '0644' if item.key.endswith('_pub') else '0600' }}"
  loop: "{{ ssh_keys | dict2items }}"
  no_log: true # Prevents secret leaking

# Collect all keys that are allowed to connect to this host
- name: "Collect authorized SSH keys for {{ inventory_hostname }}"
  ansible.builtin.set_fact:
    _authorized_keys: >-
      {{ authorized_keys
         | selectattr('hosts', 'contains', inventory_hostname)
         | map(attribute='key')
         | list }}

# Prevent writing of an empty authorized_keys
- name: "Ensure at least one authorized key is defined for {{ inventory_hostname }}"
  ansible.builtin.assert:
    that: _authorized_keys | length > 0
    fail_msg: "No entry in authorized_keys for '{{ inventory_hostname }}' – refusing to empty authorized_keys."
    quiet: true

# Write allowed keys to authorized_keys and remove if keys exist that are not allowed
- name: "Configure ~/.ssh/authorized_keys: Only allow defined SSH-Keys to connect"
  ansible.posix.authorized_key:
    user: "{{ ansible_user_id }}"
    key: "{{ _authorized_keys | join('\n') }}"
    exclusive: true
    state: present

# Create known_hosts based on template
- name: "Create ~/.ssh/known_hosts based on template"
  ansible.builtin.template:
    src: known_hosts.j2
    dest: "~/.ssh/known_hosts"
    mode: "0600"

# Add Hosts to known_hosts
- name: "Add defined Hosts to ~/.ssh/known_hosts"
  ansible.builtin.known_hosts:
    path: "~/.ssh/known_hosts"
    name: "{{ item.1 }}"
    key: "{{ item.1 }} {{ item.0.key }}"
    state: present
  loop: "{{ ssh_known_hosts | subelements('names') }}"
