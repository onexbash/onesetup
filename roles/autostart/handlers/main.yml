---
# Handler to load autostart with LaunchAgent
- name: "Load autostart LaunchAgent"
  ansible.builtin.shell: |
    launchctl bootout gui/$(id -u) "{{ HOME }}/Library/LaunchAgents/com.onexbash.xautostart.plist" 2>/dev/null || true
    launchctl bootstrap gui/$(id -u) "{{ HOME }}/Library/LaunchAgents/com.onexbash.xautostart.plist"
  listen: load_autostart
