---
# MacOS System Settings (see: https://macos-defaults.com/)

# -- -- -- -- -- -- -- -- #
# --      GENERAL      -- #
# -- -- -- -- -- -- -- -- #
# Measurement Units
- name: "Set measurement units to centimeters"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleMeasurementUnits
    type: string
    value: Centimeters
    state: present
# Automatic Software Updates
- name: "Enable auto software updates"
  become: true
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.SoftwareUpdate
    key: AutomaticCheckEnabled
    type: int
    value: 1
# Language
- name: "Set language to english(primary) and german(secondary)"
  community.general.osx_defaults:
    key: AppleLanguages
    type: array
    value:
      - en
      - de
# Dictation Prompt
- name: "Disable dictation prompt"
  community.general.osx_defaults:
    domain: com.apple.HIToolbox
    key: AppleDictationAutoEnable
    type: int
    value: 0
# Window Opening Animation
- name: "Disable window opening animation"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    # domain: "-g"
    key: NSAutomaticWindowAnimationsEnabled
    type: bool
    value: false

# -- -- -- -- -- -- -- -- #
# --      APPSTORE     -- #
# -- -- -- -- -- -- -- -- #
# Automatic Updates
- name: "Appstore | enable automatic updates"
  community.general.osx_defaults:
    domain: com.apple.commerce
    key: AutoUpdate
    type: bool
    value: true
# Automatic Downloads
- name: "Appstore | enable automatic downloads"
  community.general.osx_defaults:
    domain: com.apple.commerce
    key: AutoUpdateRestartRequired
    type: bool
    value: true

# -- -- -- -- -- -- -- -- -- -- #
# --   USER INTERFACE (UI)   -- #
# -- -- -- -- -- -- -- -- -- -- #
# Highlight Color
- name: "UI | Set highlight color"
  community.general.osx_defaults:
    key: AppleHighlightColor
    type: string
    value: "0.952900 0.545100 0.658800"
  notify: restart_systemui_server
# Accent Color
- name: "UI | Set accent color"
  community.general.osx_defaults:
    key: AppleAccentColor
    type: int
    value: 1
  notify: restart_systemui_server
# Scrollbars
- name: "UI | Always show scrollbars"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleShowScrollBars
    type: string
    value: Always

# -- -- -- -- -- -- -- -- #
# --      DESKTOP      -- #
# -- -- -- -- -- -- -- -- #
# Keep Folders on top
- name: "Desktop | keep folders on top"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: _FXSortFoldersFirstOnDesktop
    type: bool
    value: true
  notify: restart_finder
# Show Desktop Items
- name: "Desktop | show desktop items"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: CreateDesktop
    type: bool
    value: false
  notify: restart_finder
# Show Volumes
- name: "Desktop | show volumes"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowHardDrivesOnDesktop
    type: bool
    value: false
  notify: restart_finder
# Show External Volumes
- name: "Desktop | show external volumes"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowExternalHardDrivesOnDesktop
    type: bool
    value: false
  notify: restart_finder
# Show Removable Volumes
- name: "Desktop | show removable volumes"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowRemovableMediaOnDesktop
    type: bool
    value: false
  notify: restart_finder
# Show Connected Servers
- name: "Desktop | show connected servers"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowMountedServersOnDesktop
    type: bool
    value: false
  notify: restart_finder

# -- -- -- -- -- -- -- -- #
# --      MENUBAR      -- #
# -- -- -- -- -- -- -- -- #
# Clock Separator
- name: "Menubar | Blink clock separator"
  community.general.osx_defaults:
    domain: com.apple.menuextra.clock
    key: FlashDateSeparators
    type: bool
    value: false
  notify: restart_systemui_server
# Clock Date Format
- name: "Menubar | Clock date format"
  community.general.osx_defaults:
    domain: com.apple.menuextra.clock
    key: DateFormat
    type: string
    value: "EEE HH:mm"
  notify: restart_systemui_server

# -- -- -- -- -- -- -- -- #
# --       MOUSE       -- #
# -- -- -- -- -- -- -- -- #
# Mouse Acceleration
- name: "Mouse | Acceleration"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: com.apple.mouse.linear
    type: bool
    value: true
# Mouse Speed
- name: "Mouse | Speed"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: com.apple.mouse.scaling
    type: float
    value: 1.5
# Natural Scrolling
- name: "Mouse | Disable natural scrolling"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: com.apple.swipescrolldirection
    type: bool
    value: false
    state: present
  notify: semi_logout
# Pointer Size
- name: "Mouse | Set pointer size"
  community.general.osx_defaults:
    domain: com.apple.universalaccess
    key: mouseDriverCursorSize
    type: float
    value: 1.5 # 1.0 = default, 4.0 = max
# Pointer Fill Color
- name: "Mouse | Set pointer fill color"
  ansible.builtin.command: > # RGBA Values
    defaults write com.apple.universalaccess cursorFill -dict
    red -float 0.6510 green -float 0.8902 blue -float 0.6314 alpha -float 1
  changed_when: false
# Pointer Outline Color
- name: "Mouse | Set pointer outline color"
  ansible.builtin.command: > # RGBA Values
    defaults write com.apple.universalaccess cursorOutline -dict
    red -float 0.0667 green -float 0.0667 blue -float 0.1059 alpha -float 1
  changed_when: false
# Mark Pointer as customized (so System Settings shows the custom colors)
- name: "Mouse | Mark pointer as customized"
  community.general.osx_defaults:
    domain: com.apple.universalaccess
    key: cursorIsCustomized
    type: bool
    value: true
  notify: semi_logout

# -- -- -- -- -- -- -- -- #
# --      TERMINAL     -- #
# -- -- -- -- -- -- -- -- #
# Terminal follow mouse focus
- name: "Terminal | focus follows mouse"
  community.general.osx_defaults:
    domain: com.apple.Terminal
    key: FocusFollowsMouse
    type: bool
    value: true

# -- -- -- -- -- -- -- -- #
# --     TRACKPAD      -- #
# -- -- -- -- -- -- -- -- #
# Click weight
- name: "Trackpad | click weight"
  community.general.osx_defaults:
    domain: com.apple.AppleMultitouchTrackpad
    key: FirstClickThreshold
    type: int
    value: 0 # light: 0 | medium: 1 | firm: 2
# Dragging with drag lock
- name: "Trackpad | dragging with drag lock"
  community.general.osx_defaults:
    domain: com.apple.AppleMultitouchTrackpad
    key: DragLock
    type: int
    value: 0
# Dragging without drag lock
- name: "Trackpad | dragging without drag lock"
  community.general.osx_defaults:
    domain: com.apple.AppleMultitouchTrackpad
    key: Dragging
    type: int
    value: 0
# 3 Finger Drag
- name: "Trackpad | 3 finger drag"
  community.general.osx_defaults:
    domain: com.apple.AppleMultitouchTrackpad
    key: TrackpadThreeFingerDrag
    type: bool
    value: false

# -- -- -- -- -- -- -- -- #
# --     KEYBOARD      -- #
# -- -- -- -- -- -- -- -- #
# Key Hold Behavior
- name: "Keyboard | Key Hold behavior"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: ApplePressAndHoldEnabled
    type: bool
    value: false
# fn key behavior
- name: "Keyboard | fn-key behaviour (🌐︎)"
  community.general.osx_defaults:
    domain: com.apple.HIToolbox
    key: AppleFnUsageType
    type: int
    value: 0 # 0: do nothing | 1: change input source | 2: show emojis & symbols | 3: start dictation
# Function keys behavior
- name: "Keyboard | Set function keys behaviour (f1 - f12)"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: com.apple.keyboard.fnState
    type: bool
    value: true # true: use function keys as standard function keys | false: use function keys as media keys
# Drag on Gesture
- name: "Keyboard | Enable drag on gesture"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSWindowShouldDragOnGesture
    type: string
    value: "YES" # CARE: this has to be a string with "YES/NO" not a Boolean!
# Automatic Keyboard Brightness
- name: "Keyboard | Disable automatic brightness"
  become: true
  community.general.osx_defaults:
    host: null
    domain: /Library/Preferences/com.apple.iokit.AmbientLightSensor
    key: Automatic Keyboard Enabled
    type: bool
    value: false

# Keyboard Backlight Inactivity Delay
- name: "Keyboard | Set Backlight Inactivity Delay to 5 minutes"
  become: true
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.iokit.AmbientLightSensor
    key: Keyboard Dim Time
    type: int
    value: 300

# -- -- -- -- -- -- -- -- #
# --  MISSION CONTROL  -- #
# -- -- -- -- -- -- -- -- #
# Rearrange Spaces
- name: "Mission Control | auto rearrange spaces based on recent use"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: mru-spaces
    type: bool
    value: false
  notify: restart_dock
# Group Windows by application
- name: "Mission Control | group windows by application"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: expose-group-apps
    type: bool
    value: true
  notify: restart_dock
# Switch to space with open windows
- name: "Mission Control | switch to space with open windows"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleSpacesSwitchOnActivate
    type: bool
    value: true
  notify: restart_dock
# Disable Displays have separate Spaces (to prevent bugs with aerospace)
- name: "Mission Control | separate spaces per display"
  community.general.osx_defaults:
    domain: com.apple.spaces
    key: spans-display
    type: bool
    value: true
  notify: restart_dock
# Disable Edge Tiling (opens mission control when dragged to the top)
- name: "Disable edge tiling"
  community.general.osx_defaults:
    domain: com.apple.WindowManager
    key: "{{ item }}"
    type: bool
    value: false
  loop:
    - EnableTilingByEdgeDrag
    - EnableTopTilingByEdgeDrag
  notify: restart_dock

# -- -- -- -- -- -- -- -- -- #
# --   ACTIVITY MONITOR   -- #
# -- -- -- -- -- -- -- -- -- #
# Update Frequency
- name: "Activity Monitor | update frequency"
  community.general.osx_defaults:
    domain: com.apple.ActivityMonitor
    key: UpdatePeriod
    type: int
    value: 3 # update frequency in seconds
# Activity Monitor Dock Icon
- name: "Activity Monitor | dock icon"
  community.general.osx_defaults:
    domain: com.apple.ActivityMonitor
    key: IconType
    type: int
    value: 0 # 0: default icon | 2: network usage | 3: disk usage | 5: cpu usage

# -- -- -- -- -- -- -- -- #
# --   MISCELLANEOUS   -- #
# -- -- -- -- -- -- -- -- #
# Help Menu Position
- name: "Help Menu | Position"
  community.general.osx_defaults:
    domain: com.apple.helpviewer
    key: DevMode
    type: bool
    value: false

# Apple Music Notification
- name: "Apple Music | Dont show notification when a new song starts"
  community.general.osx_defaults:
    domain: com.apple.Music
    key: userWantsPlaybackNotifications
    type: bool
    value: false

# Application Quarantine Message
- name: "LaunchServices | Disable application quarantine message"
  community.general.osx_defaults:
    domain: com.apple.LaunchServices
    key: LSQuarantine
    type: bool
    value: false

# Auto Save
- name: "Global | Enable auto save"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSCloseAlwaysConfirmsChanges
    type: bool
    value: true

# Time Machine
- name: "Time machine | Dont prompt to use time machine for new disks"
  community.general.osx_defaults:
    domain: com.apple.TimeMachine
    key: DoNotOfferNewDisksForBackup
    type: bool
    value: true

# Feedback Assistant
- name: "Feedback assistant | Autogather large files"
  community.general.osx_defaults:
    domain: com.apple.appleseed.FeedbackAssistant
    key: Autogather
    type: bool
    value: true

# Apple Crash Report
- name: "Crashreporter | Disable apple crash reports"
  community.general.osx_defaults:
    domain: com.apple.CrashReporter
    key: DialogType
    type: string
    value: none

# Simulator
- name: "Simulator | Screenshot location"
  community.general.osx_defaults:
    domain: com.apple.iphonesimulator
    key: ScreenShotSaveLocation
    type: string
    value: "{{ ONESETUP_SYSTEM_STORAGE_DIR }}/Media/images/screenshots"

# Disable Startup Sound
- name: "Disable Startup Sound"
  become: true
  ansible.builtin.command: "nvram StartupMute=%01"
  changed_when: true

# Restart MacOS when it freezes
- name: "Automatically Restart on System Freeze"
  become: true
  ansible.builtin.command: "systemsetup -setrestartfreeze on"
  changed_when: true

# NOTE: The settings below are not verified yet
# -- SECURITY -- #
- name: "Security | enable firewall"
  become: true
  community.general.osx_defaults:
    domain: /Library/Preferences/com.apple.alf
    key: globalstate
    type: int
    value: 1
# MacOS Inactivity Configuration
- name: "Inactivity Configuration"
  block:
    # 1) Screen Saver (5m inactivity)
    - name: "Set Screen Saver to start after 5 minutes inactivity"
      community.general.osx_defaults:
        domain: com.apple.screensaver
        key: idleTime
        type: int
        value: 300
        state: present
    # 2) Lock Screen (25m after screen saver)
    - name: "Require password after Screen Saver"
      community.general.osx_defaults:
        domain: com.apple.screensaver
        key: askForPassword
        type: int
        value: 1
        state: present
    - name: "Set Sleep Mode Password Prompt Delay"
      community.general.osx_defaults:
        domain: com.apple.screensaver
        key: askForPasswordDelay
        type: int
        value: 1500
        state: present
    # 3) Auto Logout (25m after screen saver)
    - name: "Set Auto LogOut Delay to 30 minutes"
      become: true # set system-wide # TODO: check if this should use become or not
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: com.apple.autologout.AutoLogOutDelay
        type: int
        value: 1800 # 30min => 25m after screen saver
        state: present
    # 4) Power Management (25m after screen saver)
    - name: "Set Display sleep to 30 minutes"
      become: true
      ansible.builtin.command: "pmset -a displaysleep 30"
      changed_when: false
    - name: "Set System sleep to 30 minutes"
      become: true
      ansible.builtin.command: "pmset -a sleep 30"
      changed_when: false

# -- HOT CORNERS -- #
# Disable top-left
- name: "Hot Corners | disable top-left"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: wvous-tl-corner
    type: int
    value: 0
  notify: restart_dock
# Disable top-right
- name: "Hot Corners | disable top-right"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: wvous-tr-corner
    type: int
    value: 0
  notify: restart_dock
# Disable bottom-left
- name: "Hot Corners | disable bottom-left"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: wvous-bl-corner
    type: int
    value: 0
  notify: restart_dock
# Disable bottom-right
- name: "Hot Corners | disable bottom-right"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: wvous-br-corner
    type: int
    value: 0
  notify: restart_dock

# -- KEYBOARD REPEAT -- #
- name: "Keyboard | fast key repeat rate"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: KeyRepeat
    type: int
    value: 2
- name: "Keyboard | short initial delay"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: InitialKeyRepeat
    type: int
    value: 15

# -- SCREENSHOTS -- #
- name: "Screenshots | disable drop shadow"
  community.general.osx_defaults:
    domain: com.apple.screencapture
    key: disable-shadow
    type: bool
    value: true
- name: "Screenshots | format"
  community.general.osx_defaults:
    domain: com.apple.screencapture
    key: type
    type: string
    value: png

# -- TERMINAL -- #
- name: "Terminal | secure keyboard entry"
  community.general.osx_defaults:
    domain: com.apple.Terminal
    key: SecureKeyboardEntry
    type: bool
    value: true
