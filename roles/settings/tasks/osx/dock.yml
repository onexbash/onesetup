---
# -- -- -- -- -- -- -- #
# --   DOCK ITEMS   -- #
# -- -- -- -- -- -- -- #
# Install dockutil for managing dock items
- name: "Install 'dockutil' to manage Dock Items"
  community.general.homebrew:
    name: "dockutil"
    path: "/usr/local/bin:/opt/homebrew/bin"
    state: latest
    install_options:
      - quiet

# Clear Dock Items
- name: "Clear Dock"
  ansible.builtin.command: "dockutil --remove all --no-restart"
  register: dock_clear
  changed_when: "'Removed' in dock_clear.stdout"
  failed_when: >-
    dock_clear.rc != 0 and
    'No dock items to remove' not in dock_clear.stderr

# Add Dock Items
- name: "Add Defined Dock Items"
  ansible.builtin.command:
    argv:
      - "dockutil"
      - "--add"
      - "{{ item.path }}"
      - "--no-restart"
  loop: "{{ dock_items }}"
  when: item.path is exists
  changed_when: true

# Restart Dock daemon
- name: "Restart Dock to apply changes"
  ansible.builtin.command: "killall Dock"
  changed_when: true

# -- -- -- -- -- -- -- -- -- -- #
# --      DOCK SETTINGS      -- #
# -- -- -- -- -- -- -- -- -- -- #
# Dock Position
- name: "Dock | position"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: orientation
    type: string
    value: bottom
  notify: restart_dock
# Dock Size
- name: "Dock | size"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: tilesize
    type: float
    value: 30
  notify: restart_dock
# Dock Recent Apps
- name: "Dock | show recents"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: show-recents
    type: bool
    value: false
  notify: restart_dock
# Dock Autohide
- name: "Dock | autohide"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: show-autohide
    type: bool
    value: true
  notify: restart_dock
# Dock Autohide Animation
- name: "Dock | hide animation"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: mineffect
    type: string
    value: suck
  notify: restart_dock
# Dock Autohide Animation Duration
- name: "Dock | autohide animation duration"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: autohide-time-modifier
    type: float
    value: 0.7
  notify: restart_dock
# Dock Autohide Animation Delay
- name: "Dock | autohide delay"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: autohide-delay
    type: float
    value: 0
  notify: restart_dock
# Dock Pinned Apps
- name: "Dock | show pinned apps"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: static-only
    type: bool
    value: false
  notify: restart_dock
# Dock Show Spaces
- name: "Dock | show spaces when scrolling up on a dock item"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: scroll-to-open
    type: bool
    value: true
  notify: restart_dock
# Dock Spring Loading
- name: "Dock | enable spring loading"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: enable-spring-load-actions-on-all-items
    type: bool
    value: true
  notify: restart_dock
