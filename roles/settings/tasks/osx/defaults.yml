---
# -- -- -- -- -- -- -- -- #
# --      GENERAL      -- #    
# -- -- -- -- -- -- -- -- #
# Measurement Units
- name: "Set measurement units to centimeters"
  osx_defaults:
    domain: NSGlobalDomain
    key: AppleMeasurementUnits
    type: string
    value: Centimeters
    state: present
# Automatic Software Updates
- name: "Enable auto software updates"
  osx_defaults:
    domain: /Library/Preferences/com.apple.SoftwareUpdate
    key: AutomaticCheckEnabled
    type: int
    value: 1
  become: true
# Language
- name: "Set language to english(primary) and german(secondary)"
  osx_defaults:
    key: AppleLanguages
    type: array
    value:
      - en
      - de
# Dication Prompt
- name: "Disable dictation prompt"
  osx_defaults:
    domain: com.apple.HIToolbox
    key: AppleDictationAutoEnable
    type: int
    value: 0
# Window Opening Animation
- name: "Disable window opening animation"
  osx_defaults:
    domain: NSGlobalDomain
    # domain: "-g"
    key: NSAutomaticWindowAnimationsEnabled
    type: bool
    value: false

# -- -- -- -- -- -- -- -- #
# --      APPSTORE     -- #    
# -- -- -- -- -- -- -- -- #
# Automatic Updates
- name: "Appstore | enable automatic updates"
  osx_defaults:
    domain: com.apple.commerce
    key: AutoUpdate
    type: bool
    value: true
# Automatic Downloads
- name: "Appstore | enable automatic downloads"
  osx_defaults:
    domain: com.apple.commerce
    key: AutoUpdateRestartRequired
    type: bool
    value: true

# -- -- -- -- -- -- -- -- #
# --   USER INTERFACE  -- #    
# -- -- -- -- -- -- -- -- #
# Highlight Color
- name: "Set highlight color"
  osx_defaults:
    key: AppleHighlightColor
    type: string
    value: "0.952900 0.545100 0.658800"
  notify: restart_systemui_server
# Accent Color
- name: "Set accent color"
  osx_defaults:
    key: AppleAccentColor
    type: int
    value: 1
  notify: restart_systemui_server
# Scrollbars
- name: "Always show scrollbars"
  osx_defaults:
    domain: NSGlobalDomain
    key: AppleShowScrollBars
    type: string
    value: Always

# -- -- -- -- -- -- -- #
# --      DOCK      -- #    
# -- -- -- -- -- -- -- #
# Dock Position
- name: "Dock | position"
  osx_defaults:
    domain: com.apple.dock
    key: orientation
    type: string
    value: bottom
  notify: restart_dock
# Dock Size
- name: "Dock | size"
  osx_defaults:
    domain: com.apple.dock
    key: tilesize
    type: float
    value: 50
  notify: restart_dock
# Dock Recent Apps
- name: "Dock | show recents"
  osx_defaults:
    domain: com.apple.dock
    key: show-recents
    type: bool
    value: false
  notify: restart_dock
# Dock Autohide
- name: "Dock | autohide"
  osx_defaults:
    domain: com.apple.dock
    key: show-autohide
    type: bool
    value: true
  notify: restart_dock
# Dock Autohide Animation
- name: "Dock | hide animation"
  osx_defaults:
    domain: com.apple.dock
    key: mineffect
    type: string
    value: suck
  notify: restart_dock
# Dock Autohide Animation Duration
- name: "Dock | autohide animation duration"
  osx_defaults:
    domain: com.apple.dock
    key: autohide-time-modifier
    type: float
    value: 0.7
  notify: restart_dock
# Dock Autohide Animation Delay
- name: "Dock | autohide delay"
  osx_defaults:
    domain: com.apple.dock
    key: autohide-delay
    type: float
    value: 0
  notify: restart_dock
# Dock Pinned Apps
- name: "Dock | show pinned apps"
  osx_defaults:
    domain: com.apple.dock
    key: static-only
    type: bool
    value: false
  notify: restart_dock
# Dock Show Spaces
- name: "Dock | show spaces when scrolling up on a dock item"
  osx_defaults:
    domain: com.apple.dock
    key: scroll-to-open
    type: bool
    value: true
  notify: restart_dock
# Dock Spring Loading
- name: "Dock | enable spring loading"
  osx_defaults:
    domain: com.apple.dock
    key: enable-spring-load-actions-on-all-items
    type: bool
    value: true
  notify: restart_dock

# -- -- -- -- -- -- -- #
# --    FINDER      -- #    
# -- -- -- -- -- -- -- #
# Show Quit Option
- name: "Finder | show quit option"
  osx_defaults:
    domain: com.apple.finder
    key: QuitMenuItem
    type: bool
    value: false
  notify: restart_finder
# Show Extensions
- name: "Finder | show extensions"
  osx_defaults:
    domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: true
  notify: restart_finder
# Show Hidden Files
- name: "Finder | show hidden files"
  osx_defaults:
    domain: com.apple.finder
    key: AppleShowAllFiles
    type: bool
    value: true
  notify: restart_finder
# Show Path Bar
- name: "Finder | show path bar"
  osx_defaults:
    domain: com.apple.finder
    key: ShowPathbar
    type: bool
    value: true
  notify: restart_finder
# View Style
- name: "Finder | view style"
  osx_defaults:
    domain: com.apple.finder
    key: FXPreferredViewStyle
    type: string
    value: Nlsv # list: Nlsv | colum: clmv | gallery: glyv | icon: icnv
  notify: restart_finder
# Folder Sorting
- name: "Finder | keep folders on top"
  osx_defaults:
    domain: com.apple.finder
    key: _FXSortFoldersFirst
    type: bool
    value: true
  notify: restart_finder
# Search Scope
- name: "Finder | search scope"
  osx_defaults:
    domain: com.apple.finder
    key: FXDefaultSearchScope
    type: string
    value: SCcf # SCcf = current folder | SCsp = previous scope | SCev = entire volume
  notify: restart_finder
# Bin Emptying
- name: "Finder | empty bin after 30days"
  osx_defaults:
    domain: com.apple.finder
    key: FXRemoveOldTrashItems
    type: bool
    value: true
  notify: restart_finder
# Change File Extension Warning
- name: "Finder | change file extension warning"
  osx_defaults:
    domain: com.apple.finder
    key: FXEnableExtensionChangeWarning
    type: bool
    value: false
  notify: restart_finder
# Save to iCloud
- name: "Finder | save to icloud by default"
  osx_defaults:
    domain: com.apple.finder
    key: NSDocumentSaveNewDocumentsToCloud
    type: bool
    value: false
  notify: restart_finder
# Titlebar Hover Delay
- name: "Finder | titlebar hover delay"
  osx_defaults:
    domain: NSGlobalDomain
    key: NSToolbarTitleViewRolloverDelay
    type: float
    value: 0
  notify: restart_finder
# Sidebar Icon Size
- name: "Finder | sidebar icon size"
  osx_defaults:
    domain: NSGlobalDomain
    key: NSTableViewDefaultSizeMode
    type: int
    value: 2 # 1: small | 2: medium | 3: large
  notify: restart_finder

# -- -- -- -- -- -- -- -- #
# --      DESKTOP      -- #    
# -- -- -- -- -- -- -- -- #
# Keep Folders on top
- name: "Desktop | keep folders on top"
  osx_defaults:
    domain: com.apple.finder
    key: _FXSortFoldersFirstOnDesktop
    type: bool
    value: true
  notify: restart_finder
# Show Desktop Items
- name: "Desktop | show desktop items"
  osx_defaults:
    domain: com.apple.finder
    key: CreateDesktop
    type: bool
    value: false
  notify: restart_finder
# Show Volumes
- name: "Desktop | show volumes"
  osx_defaults:
    domain: com.apple.finder
    key: ShowHardDrivesOnDesktop
    type: bool
    value: false
  notify: restart_finder
# Show External Volumes
- name: "Desktop | show external volumes"
  osx_defaults:
    domain: com.apple.finder
    key: ShowExternalHardDrivesOnDesktop
    type: bool
    value: false
  notify: restart_finder
# Show Removable Volumes
- name: "Desktop | show removable volumes"
  osx_defaults:
    domain: com.apple.finder
    key: ShowRemovableMediaOnDesktop
    type: bool
    value: false
  notify: restart_finder
# Show Connected Servers
- name: "Desktop | show connected servers"
  osx_defaults:
    domain: com.apple.finder
    key: ShowMountedServersOnDesktop
    type: bool
    value: false
  notify: restart_finder

# -- -- -- -- -- -- -- -- #
# --      MENUBAR      -- #    
# -- -- -- -- -- -- -- -- #
# Clock Seperator
- name: "Menubar | blink clock separator"
  osx_defaults:
    domain: com.apple.menuextra.clock
    key: FlashDateSeparators
    type: bool
    value: false
  notify: restart_systemui_server
# Clock Date Format
- name: "Menubar | clock date format"
  osx_defaults:
    domain: com.apple.menuextra.clock
    key: DateFormat
    type: string
    value: "EEE HH:mm"
  notify: restart_systemui_server

# -- -- -- -- -- -- -- -- #
# --       MOUSE       -- #    
# -- -- -- -- -- -- -- -- #
# Mouse Acceleration
- name: "Mouse | acceleration"
  osx_defaults:
    domain: NSGlobalDomain
    key: com.apple.mouse.linear
    type: bool
    value: true
# Mouse Speed
- name: "Mouse | speed"
  osx_defaults:
    domain: NSGlobalDomain
    key: com.apple.mouse.scaling
    type: float
    value: 1.5 # values: https://macos-defaults.com/mouse/scaling.html#set-to-1-default-value

# -- -- -- -- -- -- -- -- #
# --      TERMINAL     -- #    
# -- -- -- -- -- -- -- -- #
# Terminal follow mouse focus
- name: "Terminal | focus follows mouse"
  osx_defaults:
    domain: com.apple.Terminal
    key: FocusFollowsMouse
    type: bool
    value: true

# -- -- -- -- -- -- -- -- #
# --     TRACKPAD      -- #    
# -- -- -- -- -- -- -- -- #
# Click weight
- name: "Trackpad | click weight"
  osx_defaults:
    domain: com.apple.AppleMultitouchTrackpad
    key: FirstClickThreshold
    type: int
    value: 0 # light: 0 | medium: 1 | firm: 2
# Dragging with drag lock
- name: "Trackpad | dragging with drag lock"
  osx_defaults:
    domain: com.apple.AppleMultitouchTrackpad
    key: DragLock
    type: int
    value: 0
# Dragging without drag lock
- name: "Trackpad | dragging without drag lock"
  osx_defaults:
    domain: com.apple.AppleMultitouchTrackpad
    key: Dragging
    type: int
    value: 0
# 3 Finger Drag
- name: "Trackpad | 3 finger drag"
  osx_defaults:
    domain: com.apple.AppleMultitouchTrackpad
    key: TrackpadThreeFingerDrag
    type: bool
    value: false

# -- -- -- -- -- -- -- -- #
# --     KEYBOARD      -- #    
# -- -- -- -- -- -- -- -- #
# Key Hold Behaviour
- name: "Keyboard | key hold behaviour"
  osx_defaults:
    domain: NSGlobalDomain
    key: ApplePressAndHoldEnabled
    type: bool
    value: false
# fn Key Behaviour
- name: "Keyboard | 🌐︎ key behaviour"
  osx_defaults:
    domain: com.apple.HIToolbox
    key: AppleFnUsageType
    type: int
    value: 0 # 0: do nothing | 1: change input source | 2: show emojis & symbols | 3: start dication
# Function keys behaviour
- name: "Keyboard | function keys behaviour (f1 - f12)"
  osx_defaults:
    domain: NSGlobalDomain
    key: com.apple.keyboard.fnState
    type: bool
    value: true # true: use function keys as standard function keys | false: use function keys as media keys
# Drag on Gesture
- name: "Keyboard | drag on gesture"
  osx_defaults:
    domain: NSGlobalDomain
    key: NSWindowShouldDragOnGesture
    type: string
    value: "YES"

# -- -- -- -- -- -- -- -- #
# --  MISSION CONTROL  -- #    
# -- -- -- -- -- -- -- -- #
# Rearrange Spaces
- name: "Mission Control | auto rearrange spaces based on recent use"
  osx_defaults:
    domain: com.apple.dock
    key: mru-spaces
    type: bool
    value: false
  notify: restart_dock
# Group Windows by application
- name: "Mission Control | group windows by application"
  osx_defaults:
    domain: com.apple.dock
    key: expose-group-apps
    type: bool
    value: true
  notify: restart_dock
# Switch to space with open windows
- name: "Mission Control | switch to space with open windows"
  osx_defaults:
    domain: NSGlobalDomain
    key: AppleSpacesSwitchOnActivate
    type: bool
    value: true
# Seperate Spaces per display
- name: "Mission Control | seperate spaces per display"
  osx_defaults:
    domain: com.apple.spaces
    key: spans-display
    type: bool
    value: false
  notify: restart_dock

# -- -- -- -- -- -- -- -- -- #
# --   ACTIVITY MONITOR   -- #    
# -- -- -- -- -- -- -- -- -- #
# Update Frequency
- name: "Activity Monitor | update frequency"
  osx_defaults:
    domain: com.apple.ActivityMonitor
    key: UpdatePeriod
    type: int
    value: 3 # update frequency in seconds
# Activity Monitor Dock Icon
- name: "Activity Monitor | dock icon"
  osx_defaults:
    domain: com.apple.ActivityMonitor
    key: IconType
    type: int
    value: 0 # 0: default icon | 2: network usage | 3: disk usage | 5: cpu usage

# -- -- -- -- -- -- -- -- #
# --   MISCELLANEOUS   -- #    
# -- -- -- -- -- -- -- -- #
# Help Menu Position
- name: "Help Menu | position"
  osx_defaults:
    domain: com.apple.helpviewer
    key: DevMode
    type: bool
    value: false

# Apple Music Notification
- name: "Dont show notification when a new song starts"
  osx_defaults:
    domain: com.apple.Music
    key: userWantsPlaybackNotifications
    type: bool
    value: false

# Application Quarantine Message
- name: "Disable application quarantine message"
  osx_defaults:
    domain: com.apple.LaunchServices
    key: LSQuarantine
    type: bool
    value: false

# Auto Save
- name: "Enable auto save"
  osx_defaults:
    domain: NSGlobalDomain
    key: NSCloseAlwaysConfirmsChanges
    type: bool
    value: true

# Time Machine
- name: "Time machine | dont prompt to use time machine for new disks"
  osx_defaults:
    domain: com.apple.TimeMachine
    key: DoNotOfferNewDisksForBackup
    type: bool
    value: true

# Messages (iMessage)
- name: "Messages | subject field"
  osx_defaults:
    domain: com.apple.MobileSMS
    key: MMSShowSubject
    type: bool
    value: true

# Feedback Assistant
- name: "Feedback assistant | autogather large files"
  osx_defaults:
    domain: com.apple.appleseed.FeedbackAssistant
    key: Autogather
    type: bool
    value: true

# Apple Crash Report
- name: "Disable apple crash reports"
  osx_defaults:
    domain: com.apple.CrashReporter
    key: DialogType
    type: string
    value: none

# Simulator
- name: "simulator | screenshot location"
  osx_defaults:
    domain: com.apple.iphonesimulator
    key: ScreenShotSaveLocation
    type: string
    value: "{{ ONESETUP_CLOUD_DIR }}/media/images/screenshots"

# Disable Startup Sound
- name: "Disable Startup Sound"
  ansible.builtin.command: "nvram StartupMute=%01"
  become: true
  changed_when: true

# Restart MacOS when it freezes
- name: "Automatically Restart on System Freeze"
  ansible.builtin.command: "systemsetup -setrestartfreeze on"
  become: true
  changed_when: true


# NOTE: The settings below are not verified yet
# -- SECURITY -- #
- name: "Security | require password immediately after sleep/screensaver"
  osx_defaults:
    domain: com.apple.screensaver
    key: askForPassword
    type: int
    value: 1
- name: "Security | password delay"
  osx_defaults:
    domain: com.apple.screensaver
    key: askForPasswordDelay
    type: int
    value: 0
- name: "Security | enable firewall"
  osx_defaults:
    domain: /Library/Preferences/com.apple.alf
    key: globalstate
    type: int
    value: 1
  become: true

# -- HOT CORNERS -- #
# Disable top-left
- name: "Hot Corners | disable top-left"
  osx_defaults:
    domain: com.apple.dock
    key: wvous-tl-corner
    type: int
    value: 0
  notify: restart_dock
# Disable top-right  
- name: "Hot Corners | disable top-right"
  osx_defaults:
    domain: com.apple.dock
    key: wvous-tr-corner
    type: int
    value: 0
  notify: restart_dock
# Disable bottom-left
- name: "Hot Corners | disable bottom-left"
  osx_defaults:
    domain: com.apple.dock
    key: wvous-bl-corner
    type: int
    value: 0
  notify: restart_dock
# Disable bottom-right
- name: "Hot Corners | disable bottom-right"
  osx_defaults:
    domain: com.apple.dock
    key: wvous-br-corner
    type: int
    value: 0
  notify: restart_dock

# -- KEYBOARD REPEAT (dev QoL) -- #
- name: "Keyboard | fast key repeat rate"
  osx_defaults:
    domain: NSGlobalDomain
    key: KeyRepeat
    type: int
    value: 2
- name: "Keyboard | short initial delay"
  osx_defaults:
    domain: NSGlobalDomain
    key: InitialKeyRepeat
    type: int
    value: 15

# -- SCREENSHOTS -- #
- name: "Screenshots | disable drop shadow"
  osx_defaults:
    domain: com.apple.screencapture
    key: disable-shadow
    type: bool
    value: true
- name: "Screenshots | format"
  osx_defaults:
    domain: com.apple.screencapture
    key: type
    type: string
    value: png

# -- SAFARI DEV -- #
- name: "Safari | enable develop menu"
  osx_defaults:
    domain: com.apple.Safari
    key: IncludeDevelopMenu
    type: bool
    value: true

# -- TERMINAL -- #
- name: "Terminal | secure keyboard entry"
  osx_defaults:
    domain: com.apple.Terminal
    key: SecureKeyboardEntry
    type: bool
    value: true
