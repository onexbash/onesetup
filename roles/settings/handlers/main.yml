---
# Handler: Restart Dock Daemon
- name: "Restart Dock"
  ansible.builtin.command: "killall Dock"
  listen: restart_dock

# Handler: Restart Finder Daemon
- name: "Restart Finder"
  ansible.builtin.command: killall Finder
  listen: restart_finder

# Handler: Restart SystemUIServer Daemon
- name: "Restart SystemUIServer"
  ansible.builtin.command: killall SystemUIServer
  listen: restart_systemui_server

# Handler: Refresh preferences cache
- name: "Restart preferences cache (cfprefsd)"
  ansible.builtin.command: killall cfprefsd
  listen: restart_cache

# Handler: Log out current user (applies NSGlobalDomain changes)
- name: "Log out user to apply NSGlobalDomain Changes"
  ansible.builtin.shell: >
    sleep 5 && osascript -e 'tell application "System Events" to log out'
  async: 10
  poll: 0
  listen: logout_user
