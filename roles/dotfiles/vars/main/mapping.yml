---
# --   DOTFILES MAPPING   -- #

# shell_config
shell_config: { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/shell/config", dest: "{{ xdg_config_home }}/shell" }
# shell_home
shell_home: { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/shell/home", dest: "{{ home }}" }

dotfiles:
  # aerospace
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/aerospace", dest: "{{ xdg_config_home }}/aerospace" }
  # atuin
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/atuin", dest: "{{ xdg_config_home }}/atuin" }
  # eza
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/eza", dest: "{{ xdg_config_home }}/eza" }
  # scripts
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/scripts", dest: "{{ xdg_config_home }}/scripts" }
  # ghostty
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/ghostty", dest: "{{ xdg_config_home }}/ghostty" }
  # kitty
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/kitty", dest: "{{ xdg_config_home }}/kitty" }
  # wezterm
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/wezterm", dest: "{{ xdg_config_home }}/wezterm" }
  # zellij
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/zellij", dest: "{{ xdg_config_home }}/zellij" }
  # git
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/git", dest: "{{ xdg_config_home }}/git" }
  # lazygit
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/lazygit", dest: "{{ xdg_config_home }}/lazygit" }
  # nvim
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/nvim", dest: "{{ xdg_config_home }}/nvim" }
  # powershell
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/powershell", dest: "{{ xdg_config_home }}/powershell" }
  # starship
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/starship", dest: "{{ xdg_config_home }}/starship" }
  # vim
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/vim", dest: "{{ xdg_config_home }}/vim" }
  # github (gh)
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/gh", dest: "{{ xdg_config_home }}/gh" }
  # onesetup
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/onesetup", dest: "{{ xdg_config_home }}/onesetup" }
  # zed
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/zed", dest: "{{ xdg_config_home }}/zed" }
  # litexl
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/litexl", dest: "{{ xdg_config_home }}/lite-xl" }
  # ascii-arts
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/ascii-arts", dest: "{{ xdg_config_home }}/ascii-arts" }
  # fastfetch
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/fastfetch", dest: "{{ xdg_config_home }}/fastfetch" }
  # borders (JankyBorders)
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/borders", dest: "{{ xdg_config_home }}/borders" }
  # gck (git-credential-keepassxc)
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/gck", dest: "{{ xdg_config_home }}/gck" }

  # -- single files -- #
  # claude (settings.json)
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/claude/settings.json", dest: "{{ xdg_config_home }}/claude/settings.json" }
  # claude (CLAUDE.md)
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/claude/CLAUDE.md", dest: "{{ xdg_config_home }}/claude/CLAUDE.md" }
  # azure (config)
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/azure/config", dest: "{{ xdg_config_home }}/azure/config" }
  # containers (containers.conf)
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/containers/containers.conf", dest: "{{ xdg_config_home }}/containers/containers.conf" }
  # peazip (config)
  - { src: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}/peazip/conf.txt", dest: "{{ xdg_config_home }}/peazip/conf.txt" }
