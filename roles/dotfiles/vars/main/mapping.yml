---
# --                      -- #
# --   DOTFILES MAPPING   -- #
# --                      -- #
dotfiles_mapping:
  # -- Home Directory -- #
  # ~/ -> $HOME
  - { src: shell/home/.zshrc, dest: "{{ home }}/.zshrc" }
  - { src: shell/home/.bashrc, dest: "{{ home }}/.bashrc" }

  # -- Config Directory -- #
  # ~/.config -> $XDG_CONFIG_HOME
  - { src: shell/config, dest: "{{ xdg_config_home }}/shell" }
  - { src: aerospace, dest: "{{ xdg_config_home }}/aerospace" }
  - { src: atuin, dest: "{{ xdg_config_home }}/atuin" }
  - { src: eza, dest: "{{ xdg_config_home }}/eza" }
  - { src: scripts, dest: "{{ xdg_config_home }}/scripts" }
  - { src: ghostty, dest: "{{ xdg_config_home }}/ghostty" }
  - { src: kitty, dest: "{{ xdg_config_home }}/kitty" }
  - { src: wezterm, dest: "{{ xdg_config_home }}/wezterm" }
  - { src: zellij, dest: "{{ xdg_config_home }}/zellij" }
  - { src: tuios, dest: "{{ xdg_config_home }}/tuios" }
  - { src: git, dest: "{{ xdg_config_home }}/git" }
  - { src: lazygit, dest: "{{ xdg_config_home }}/lazygit" }
  - { src: nvim, dest: "{{ xdg_config_home }}/nvim" }
  - { src: powershell, dest: "{{ xdg_config_home }}/powershell" }
  - { src: starship, dest: "{{ xdg_config_home }}/starship" }
  - { src: vim, dest: "{{ xdg_config_home }}/vim" }
  - { src: gh, dest: "{{ xdg_config_home }}/gh" }
  - { src: zed, dest: "{{ xdg_config_home }}/zed" }
  - { src: litexl, dest: "{{ xdg_config_home }}/lite-xl" }
  - { src: ascii-arts, dest: "{{ xdg_config_home }}/ascii-arts" }
  - { src: fastfetch, dest: "{{ xdg_config_home }}/fastfetch" }
  - { src: borders, dest: "{{ xdg_config_home }}/borders" } # JankyBorders
  - { src: gck, dest: "{{ xdg_config_home }}/gck" } # git-credential-keepassxc
  - { src: mise, dest: "{{ xdg_config_home }}/mise" } # mise-en-place

  # -- Config Sub-Directories -- #
  # ~/.config/[app] -> $XDG_CONFIG_HOME/[app]
  - {
      src: claude/settings.json,
      dest: "{{ xdg_config_home }}/claude/settings.json",
    }
  - { src: claude/CLAUDE.md, dest: "{{ xdg_config_home }}/claude/CLAUDE.md" }
  - { src: claude/agents, dest: "{{ xdg_config_home }}/claude/agents" }
  - { src: claude/themes, dest: "{{ xdg_config_home }}/claude/themes" }
  - {
      src: claude/policy-limits.json,
      dest: "{{ xdg_config_home }}/claude/policy-limits.json",
    }
  - {
      src: claude/ponytail-statusline.sh,
      dest: "{{ xdg_config_home }}/claude/ponytail-statusline.sh",
    }
  - {
      src: claude/remote-settings.json,
      dest: "{{ xdg_config_home }}/claude/remote-settings.json",
    }
  - { src: azure/config, dest: "{{ xdg_config_home }}/azure/config" }
  - {
      src: containers/containers.conf,
      dest: "{{ xdg_config_home }}/containers/containers.conf",
    }
  - { src: peazip/conf.txt, dest: "{{ xdg_config_home }}/peazip/conf.txt" }

  # -- Global Configs -- #
  # /etc
  # - { src: etc/example.conf, dest: "/etc/example.conf", become: true }

  # -- Application Support -- #
  # ~/Library/Application Support -> `$HOME/Library/Application Support`
  # - { src: example/example.json, dest: "{{ home }}/Library/Application Support/Example/example.json" }

  # --  Aliases -- #
  # Multiple locations (e.g: ~/.config/claude -> ~/.claude)
  - { src: "{{ xdg_config_home }}/claude", dest: "{{ home }}/.claude" }
