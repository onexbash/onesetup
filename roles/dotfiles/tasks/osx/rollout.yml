# Report: Failed Symlinks
- name: "Report: Failed Symlinks"
  ansible.builtin.debug:
    msg: "Could not symlink: {{ failed_links | join(', ') }}"
  vars:
    failed_links: >-
      {{ dotfile_links.results
         | selectattr('failed', 'defined')
         | selectattr('failed')
         | map(attribute='item.dest')
         | list }}
  when: failed_links | length > 0

# --                  -- #
# --   SHELL CONFIG   -- #
# --                  -- #
# Cleanup: Shell Config Directory
- name: "Cleanup: Shell Config Directory"
  ansible.builtin.file:
    path: "{{ shell_config.dest }}"
    state: absent
    force: true

# Symlink: Shell Config Directory
- name: "Symlink shell config directory"
  ansible.builtin.file:
    src: "{{ shell_config.src }}"
    dest: "{{ shell_config.dest }}"
    state: link
    force: true

# Find: User Shell Files
- name: "Find: User Shell Files"
  ansible.builtin.find:
    paths: "{{ shell_home.src }}"
    file_type: file
    hidden: true # Important to include hidden files starting with '.'
  register: user_shell_files

# Symlink: User Shell Files
- name: "Symlink: User Shell Files"
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ shell_home.dest }}/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ user_shell_files.files }}"

# Cleanup: ~/.claude
- name: "Cleanup: ~/.claude"
  ansible.builtin.file:
    path: "{{ home }}/.claude"
    state: absent
    force: true

# Symlink: ~/.config/claude to ~/.claude (because some parts of claude-code ignore the $CLAUDE_CONFIG_DIR env-var)
- name: "Symlink: Claude Config Directory"
  ansible.builtin.file:
    src: "{{ xdg_config_home }}/claude"
    dest: "{{ home }}/.claude"
    state: link
    force: true

# -- SECRETS -- #
- name: "Set path to shell secrets file"
  ansible.builtin.set_fact:
    shell_secrets_file: "{{ lookup('env', 'XDG_CONFIG_HOME') | default(ansible_env.HOME ~ '/.config', true) }}/shell/secrets.sh"

- name: "Check that the token is safe inside double quotes"
  ansible.builtin.assert:
    that: claude_code_oauth_token is match('^[A-Za-z0-9_-]+$')
    quiet: true
  no_log: true

- name: "Ensure shell secrets file exists with restricted permissions"
  ansible.builtin.file:
    path: "{{ shell_secrets_file }}"
    state: touch
    mode: "0600"
    access_time: preserve
    modification_time: preserve

- name: "Ensure CLAUDE_CODE_OAUTH_TOKEN is set in shell secrets"
  ansible.builtin.lineinfile:
    path: "{{ shell_secrets_file }}"
    regexp: '^\s*export\s+CLAUDE_CODE_OAUTH_TOKEN='
    line: 'export CLAUDE_CODE_OAUTH_TOKEN="{{ claude_code_oauth_token }}"'
    mode: "0600"
  no_log: true
  diff: false
