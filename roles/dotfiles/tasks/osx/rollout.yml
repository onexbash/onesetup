---
# --              -- #
# --   DOTFILES   -- #
# --              -- #
# Clone via SSH if ONESETUP_REMOTE_SSH_KEY is set, otherwise via HTTPS.
# The SSH key passphrase is read from the environment variable ONESETUP_REMOTE_SSH_PASS
# It is only requested by ssh if the key is encrypted and not already loaded in a running agent
- name: "Set Dotfiles Repository URI and Git Environment"
  ansible.builtin.set_fact:
    dotfiles_use_ssh: "{{ _use_ssh }}"
    dotfiles_repo: >-
      {{ (X_DOTFILES_URI | regex_replace('^https?://([^/]+)/(.+?)(\.git)?/?$', 'git@\1:\2.git'))
         if _use_ssh
         else (X_DOTFILES_URI | regex_replace('^(?:ssh://)?git@([^:/]+)[:/](.+?)(\.git)?/?$', 'https://\1/\2.git')) }}
    # Only set for SSH: git also falls back to SSH_ASKPASS for HTTPS credential prompts,
    # which would send the key passphrase to the server as a username.
    dotfiles_git_env: >-
      {{ {'SSH_ASKPASS': playbook_dir ~ '/files/ssh_askpass.sh', 'SSH_ASKPASS_REQUIRE': 'force'}
         if _use_ssh else {} }}
  vars:
    _use_ssh: "{{ ONESETUP_REMOTE_SSH_KEY | default('') | length > 0 }}"

# Clone Dotfiles Repository
- name: "Clone Dotfiles Repository"
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    key_file: "{{ ONESETUP_REMOTE_SSH_KEY if dotfiles_use_ssh | bool else omit }}"
    ssh_opts: "{{ '-o BatchMode=no' if dotfiles_use_ssh | bool else omit }}" # allow passphrase via SSH_ASKPASS
    accept_newhostkey: "{{ dotfiles_use_ssh | bool }}" # trust host key on first connect, reject changed keys
    version: main
    clone: true
    dest: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}"
    force: false # respect local changes to prevent dotfile loss
    remote: origin
    update: true
    recursive: true # whether submodules should be included/skipped
  environment: "{{ dotfiles_git_env }}"
  register: dotfiles_clone
  # Tolerate only "local modifications" (handled below); any other error (auth, network, ...) fails the play
  failed_when:
    - dotfiles_clone.failed | default(false)
    - "'Local modifications' not in (dotfiles_clone.msg | default(''))"

# Detect local modifications in the dotfiles directory
- name: "Dotfiles: Detect Local Modifications"
  ansible.builtin.set_fact:
    dotfiles_local_changes: "{{ 'Local modifications' in (dotfiles_clone.msg | default('')) }}"

# Prompt User if local changes can be overwritten
- name: "Prompt: Overwrite Local Dotfiles Directory?"
  ansible.builtin.pause:
    prompt: "Local modifications detected in {{ ONESETUP_SYSTEM_DOTFILES_DIR }}. Overwrite and lose local changes? [y/n]"
  register: dotfiles_overwrite_prompt
  when: dotfiles_local_changes | bool

# Clone Dotfiles Repository and force overwrite local changes (after user confirmation)
- name: "Clone Dotfiles Repository (force overwrite)"
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    key_file: "{{ ONESETUP_REMOTE_SSH_KEY if dotfiles_use_ssh | bool else omit }}"
    ssh_opts: "{{ '-o BatchMode=no' if dotfiles_use_ssh | bool else omit }}"
    accept_newhostkey: "{{ dotfiles_use_ssh | bool }}"
    version: main
    clone: true
    dest: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}"
    force: true # overwrite local changes as the user confirmed this
    remote: origin
    update: true
    recursive: true # whether submodules should be included/skipped
  environment: "{{ dotfiles_git_env }}"
  when:
    - dotfiles_local_changes | bool
    - dotfiles_overwrite_prompt.user_input | lower == 'y'

# Notify: Skipping Dotfiles Rollout
- name: "Info: Skipping Dotfiles Rollout.."
  ansible.builtin.debug:
    msg: "Skipping Dotfiles Rollout & continue playbook — local changes in {{ ONESETUP_SYSTEM_DOTFILES_DIR }} preserved."
  when:
    - dotfiles_local_changes | bool
    - dotfiles_overwrite_prompt.user_input | lower != 'y'

# Skip Dotfiles Role and continue playbook if User declined to overwrite local changes
- name: "Skip Dotfiles Role and continue playbook"
  ansible.builtin.meta: end_role
  when:
    - dotfiles_local_changes | bool
    - dotfiles_overwrite_prompt.user_input | lower != 'y'

# Ensure parent directories of file-only dotfiles exist
- name: "Ensure parent directories of file-only dotfiles exist"
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
    state: "directory"
  loop: "{{ dotfiles | map(attribute='dest') | map('dirname') | unique }}"

# Symlink Dotfiles (atomic)
- name: "Symlink: Dotfiles"
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - |
        [ "$(readlink "$2")" = "$1" ] && { echo ok; exit 0; }
        i=0
        while [ "$i" -lt 10 ]; do
          rm -rf "$2"
          ln -s "$1" "$2" 2>/dev/null
          [ "$(readlink "$2")" = "$1" ] && { echo changed; exit 0; }
          i=$((i + 1))
        done
        echo "could not replace $2: it keeps being recreated" >&2
        exit 1
      - sh
      - "{{ item.src }}"
      - "{{ item.dest }}"
  loop: "{{ dotfiles }}"
  register: dotfile_links
  changed_when: dotfile_links.stdout | default('') == 'changed'
  ignore_errors: true

