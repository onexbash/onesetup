---
# --              -- #
# --   DOTFILES   -- #
# --              -- #
# Set Remote Origin of Dotfiles Repository (SSH if possible, HTTPS as fallback)
- name: "Set Dotfiles Repository URI and Git Environment"
  ansible.builtin.set_fact:
    dotfiles_use_ssh: "{{ _use_ssh }}"
    dotfiles_repo: >-
      {{ (X_DOTFILES_URI | regex_replace('^https?://([^/]+)/(.+?)(\.git)?/?$', 'git@\1:\2.git'))
         if _use_ssh
         else (X_DOTFILES_URI | regex_replace('^(?:ssh://)?git@([^:/]+)[:/](.+?)(\.git)?/?$', 'https://\1/\2.git')) }}
    dotfiles_git_env: >-
      {{ {'SSH_ASKPASS': playbook_dir ~ '/files/ssh_askpass.sh', 'SSH_ASKPASS_REQUIRE': 'force'}
         if _use_ssh else {} }}
  vars:
    _use_ssh: "{{ ONESETUP_REMOTE_SSH_KEY | default('') | length > 0 }}"

# Clone Dotfiles Repository
- name: "Clone Dotfiles Repository"
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    key_file: "{{ ONESETUP_REMOTE_SSH_KEY if dotfiles_use_ssh | bool else omit }}"
    ssh_opts: "{{ '-o BatchMode=no' if dotfiles_use_ssh | bool else omit }}" # allow passphrase via SSH_ASKPASS
    accept_newhostkey: "{{ dotfiles_use_ssh | bool }}" # trust host key on first connect, reject changed keys
    version: main
    clone: true
    dest: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}"
    force: false # respect local changes to prevent dotfile loss
    remote: origin
    update: true
    recursive: true # whether submodules should be included/skipped
  environment: "{{ dotfiles_git_env }}"
  register: dotfiles_clone
  # Tolerate only "local modifications" (handled below); any other error (auth, network, ...) fails the play
  failed_when:
    - dotfiles_clone.failed | default(false)
    - "'Local modifications' not in (dotfiles_clone.msg | default(''))"

# Detect local changes
- name: "Dotfiles: Detect Local Modifications"
  ansible.builtin.set_fact:
    dotfiles_local_changes: "{{ 'Local modifications' in (dotfiles_clone.msg | default('')) }}"

# Prompt User if local changes can be overwritten
- name: "Prompt: Overwrite Local Dotfiles Directory?"
  ansible.builtin.pause:
    prompt: "Local modifications detected in {{ ONESETUP_SYSTEM_DOTFILES_DIR }}. Overwrite and lose local changes? [y/n]"
  register: dotfiles_overwrite_prompt
  when: dotfiles_local_changes | bool

# Force Overwrite Dotfiles Repository (after user confirmation)
- name: "Clone Dotfiles Repository (force overwrite)"
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    key_file: "{{ ONESETUP_REMOTE_SSH_KEY if dotfiles_use_ssh | bool else omit }}"
    ssh_opts: "{{ '-o BatchMode=no' if dotfiles_use_ssh | bool else omit }}"
    accept_newhostkey: "{{ dotfiles_use_ssh | bool }}"
    version: main
    clone: true
    dest: "{{ ONESETUP_SYSTEM_DOTFILES_DIR }}"
    force: true # overwrite local changes as the user confirmed this
    remote: origin
    update: true
    recursive: true # whether submodules should be included/skipped
  environment: "{{ dotfiles_git_env }}"
  when:
    - dotfiles_local_changes | bool
    - dotfiles_overwrite_prompt.user_input | lower == 'y'

# Notify: Skipping Dotfiles Rollout
- name: "Info: Skipping Dotfiles Rollout.."
  ansible.builtin.debug:
    msg: "Skipping Dotfiles Rollout & continue playbook — local changes in {{ ONESETUP_SYSTEM_DOTFILES_DIR }} preserved."
  when:
    - dotfiles_local_changes | bool
    - dotfiles_overwrite_prompt.user_input | lower != 'y'

# Skip Dotfiles Role and continue playbook if User declined to overwrite local changes
- name: "Skip Dotfiles Role and continue playbook"
  ansible.builtin.meta: end_role
  when:
    - dotfiles_local_changes | bool
    - dotfiles_overwrite_prompt.user_input | lower != 'y'

# --              -- #
# --   SYMLINKS   -- #
# --              -- #
# Inspect Sources in Dotfiles-Mapping
- name: "Dotfiles: Inspect link sources"
  ansible.builtin.stat:
    path: "{{ _src }}"
    get_checksum: false
  vars: &dotfiles_mapping_paths
    _src: >-
      {{ ((item.src is abs) | ternary(item.src, ONESETUP_SYSTEM_DOTFILES_DIR ~ '/' ~ item.src))
         | regex_replace('/+$', '') }}
    _dest: "{{ item.dest | regex_replace('/+$', '') }}"
  become: "{{ item.become | default(false) }}"
  loop: "{{ dotfiles_mapping }}"
  loop_control:
    label: "{{ item.src }}"
  register: dotfiles_src_stat

# Inspect Destinations in Dotfiles-Mapping
- name: "Dotfiles: Inspect link destinations"
  ansible.builtin.stat:
    path: "{{ _dest }}"
    follow: false # inspect the link itself, also detects broken links
    get_checksum: false
  vars: *dotfiles_mapping_paths
  become: "{{ item.become | default(false) }}"
  loop: "{{ dotfiles_mapping }}"
  loop_control:
    label: "{{ item.dest }}"
  register: dotfiles_dest_stat

# Validate the Symlink before creating it
- name: "Dotfiles: Validate links"
  ansible.builtin.assert:
    that: _problems | length == 0
    fail_msg: "{{ _problems }}"
    quiet: true
  vars:
    _problems: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for s, d in dotfiles_src_stat.results | zip(dotfiles_dest_stat.results) -%}
        {%- if not s.stat.exists and s.item.src is not abs -%}
          {%- set ns.out = ns.out + ['source missing in repo: ' ~ s.item.src] -%}
        {%- elif s.stat.exists and d.stat.exists and not d.stat.islnk
                 and d.stat.inode == s.stat.inode and d.stat.dev == s.stat.dev -%}
          {%- set ns.out = ns.out + ['parent of ' ~ d.item.dest ~ ' links into the repo, remove that parent link first'] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.out }}

# Cleanup Destination (with Backup)
- name: "Dotfiles: Back up real files/directories at link destinations"
  ansible.builtin.command:
    argv:
      - mv
      - "{{ item.stat.path }}"
      - "{{ item.stat.path }}.backup-{{ now(fmt='%Y%m%d-%H%M%S') }}"
  become: "{{ item.item.become | default(false) }}"
  loop: "{{ dotfiles_dest_stat.results | selectattr('stat.exists') | rejectattr('stat.islnk') | list }}"
  loop_control:
    label: "{{ item.stat.path }}"
  register: dotfiles_backups
  changed_when: true

# Create Parent Directory if missing
- name: "Dotfiles: Ensure parent directories exist" # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ _dest | dirname }}"
    state: directory
  vars: *dotfiles_mapping_paths
  become: "{{ item.become | default(false) }}"
  loop: "{{ dotfiles_mapping }}"
  loop_control:
    label: "{{ _dest | dirname }}"

# Symlink Dotfiles
- name: "Dotfiles: Symlink"
  ansible.builtin.file:
    src: "{{ _src }}"
    dest: "{{ _dest }}"
    state: link
    force: true # replace links that point elsewhere
  vars: *dotfiles_mapping_paths
  become: "{{ item.become | default(false) }}"
  loop: "{{ dotfiles_mapping }}"
  loop_control:
    label: "{{ item.dest }}"
  register: dotfiles_link
  ignore_errors: true

# Show a Report of Destination Backups
- name: "Report: Backed up files/directories"
  ansible.builtin.debug:
    msg: "{{ dotfiles_backups.results | map(attribute='cmd') | map('last') | list }}"
  when: dotfiles_backups.results | default([]) | length > 0

# Show a Report of Failed Symlink Creations
- name: "Report: Failed Symlinks"
  ansible.builtin.debug:
    msg: "Could not symlink: {{ failed_links | join(', ') }}"
  vars:
    failed_links: >-
      {{ dotfiles_link.results
         | selectattr('failed', 'defined')
         | selectattr('failed')
         | map(attribute='item.dest')
         | list }}
  when: failed_links | length > 0
