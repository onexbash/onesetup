# Add custom PATH entries to /etc/paths.d/
- name: "Add custom PATH entries to /etc/paths.d/"
  copy:
    dest: /etc/paths.d/homebrew
    content: "/opt/homebrew/bin\n/opt/homebrew/sbin\n"
    mode: "0644"
  become: true
  when: ansible_facts["ONESETUP_SYSTEM_OS"] == "osx"

# Ensure specified login shells exist in /etc/shells
- name: "Ensure specified login shells exist in /etc/shells"
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ item }}"
    create: false
  loop:
    - /bin/bash
    - /bin/csh
    - /bin/dash
    - /bin/ksh
    - /bin/sh
    - /bin/tcsh
    - /bin/zsh
    - /opt/homebrew/bin/bash
    - /opt/homebrew/bin/zsh
    - /opt/homebrew/bin/pwsh
    - /opt/homebrew/opt/powershell/bin/pwsh
  become: true

# Cleanup: Shell Config Directory
- name: "Cleanup: Shell Config Directory"
  ansible.builtin.file:
    path: "{{ shell_config.dest }}"
    state: absent
    force: true

# Symlink: Shell Config Directory
- name: "Symlink shell config directory"
  ansible.builtin.file:
    src: "{{ shell_config.src }}"
    dest: "{{ shell_config.dest }}"
    state: link
    force: true

# Find: User Shell Files
- name: "Find: User Shell Files"
  ansible.builtin.find:
    paths: "{{ shell_home.src }}"
    file_type: file
    hidden: true # Important to include hidden files starting with '.'
  register: user_shell_files

# Symlink: User Shell Files
- name: "Symlink: User Shell Files"
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ shell_home.dest }}/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ user_shell_files.files }}"

# Cleanup: Dotfiles (dest)
- name: "Cleanup: Dotfiles"
  ansible.builtin.file:
    path: "{{ item_dotfiles.dest }}"
    state: "absent"
    force: true
  loop: "{{ dotfiles }}"
  loop_control:
    loop_var: "item_dotfiles"
  ignore_errors: true
  become: true

# Symlink: Dotfiles
- name: "Symlink: Dotfiles"
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: "link"
    force: true
  loop: "{{ dotfiles }}"
  ignore_errors: true
